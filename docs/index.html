        ${rev&&!del?`<div class="cm-rev"><span class="chip ${m.status==='Selesai'?'g':'a'}">Revisi · ${esc(m.status||'Open')}</span>${m._pending?'':`<button class="link" data-act="chat-status" data-id="${esc(m.id)}">${m.status==='Selesai'?'Buka lagi':'Tandai selesai'}</button>`}</div>`:''}
        <div class="cm-x">${del?'<i class="faint">Pesan dihapus admin</i>':linkify(m.text)}</div>
        ${m._pending?`<div class="cm-s">${m._err?`<span style="color:var(--r)">Gagal terkirim.</span> <button class="link" data-act="chat-retry" data-id="${esc(m.id)}">Kirim ulang</button>`:'Mengirim…'}</div>`:''}
        ${CHAT.admin&&!del&&!m._pending?`<button class="link cm-del" data-act="chat-del" data-id="${esc(m.id)}">Hapus</button>`:''}</div></div>`}).join('');
  if(nearBottom||CHAT._scroll){el.scrollTop=el.scrollHeight;CHAT._scroll=false}}
function chatOpen(topic){CHAT.open=true;if(topic!=null){CHAT.topic=topic;CHAT.filter=topic||'_'}CHAT._scroll=true;renderChatShell();chatSeen();renderChatFab();clearTimeout(CHAT.timer);chatPoll();setTimeout(()=>{const t=$('#chat-text');t&&t.focus()},50)}
function chatClose(){CHAT.open=false;const c=$('#chat');if(c)c.hidden=true;renderChatFab();chatSchedule()}
async function chatSend(tmp){CHAT.pending=CHAT.pending.filter(x=>x.id!==tmp.id);tmp._err=false;CHAT.pending.push(tmp);CHAT._scroll=true;renderChatList();
  try{const m=await B.postChat({text:tmp.text,topic:tmp.topic,kind:tmp.kind});CHAT.pending=CHAT.pending.filter(x=>x.id!==tmp.id);chatMerge([m]);chatSeen()}
  catch(e){tmp._err=true;renderChatList();toast(e.message,true);if(e.code==='AUTH')logout(e.message)}}
document.addEventListener('submit',e=>{if(e.target&&e.target.id==='chat-form'){e.preventDefault();const ta=$('#chat-text');const text=ta.value.trim();if(!text)return;
  const tmp={id:'tmp'+Date.now(),ts:new Date().toISOString(),author:SESSION.name||'Saya',text,topic:$('#chat-topic').value,kind:e.target.elements.ck.value,status:e.target.elements.ck.value==='revisi'?'Open':'',_pending:true};
  ta.value='';ta.style.height='';chatSend(tmp)}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='chat-text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#chat-form').requestSubmit()}});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='chat-text'){const t=e.target;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}});
document.addEventListener('change',e=>{if(!e.target)return;if(e.target.id==='chat-filter'){CHAT.filter=e.target.value;CHAT._scroll=true;renderChatList()}
  if(e.target.id==='chat-topic')CHAT.topic=e.target.value;if(e.target.name==='ck')CHAT.kind=e.target.value});
function chatAdminPrompt(){$('#modal-root').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="at" style="max-width:420px"><div class="mh"><h2 id="at">Mode admin diskusi</h2><button class="btn ghost sm x" data-act="close-modal" aria-label="Tutup">✕</button></div>
  <form id="adm-form" novalidate style="display:grid;grid-template-columns:1fr;gap:12px"><p class="muted" style="margin:0;font-size:13px">Admin dapat menghapus pesan dan membersihkan seluruh percakapan.</p><div class="fld"><label for="adm-pass">Password admin</label><div class="pw"><input id="adm-pass" type="password" autocomplete="current-password"><button type="button" class="pw-eye" data-act="pw-eye" aria-label="Tampilkan password" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button></div></div><div class="err" id="adm-err" role="alert"></div>
  <div class="mf"><button type="button" class="btn" data-act="close-modal">Batal</button><button type="submit" class="btn pri" id="adm-go">Masuk mode admin</button></div></form></div></div>`;
  setTimeout(()=>$('#adm-pass').focus(),30);
  $('#adm-form').addEventListener('submit',async ev=>{ev.preventDefault();const p=$('#adm-pass').value;const go=$('#adm-go');go.disabled=true;go.textContent='Memeriksa…';
    try{await B.checkAdmin(p);CHAT.admin=p;closeModal();renderChatShell();toast('Mode admin aktif')}
    catch(e){$('#adm-err').textContent=e.message;go.disabled=false;go.textContent='Masuk mode admin'}})}

/* ---------- actions ---------- */
function exportCSV(){
  const cols=[['code','Kode'],['name','Proyek'],['segment','Segmen'],['phase','Fase'],['rag','RAG'],['priority','Prioritas'],['pm','PM'],['sponsor','Sponsor'],['start','Mulai'],['end','Target selesai'],['progress','Progres %'],['_el','Waktu berjalan %'],['_var','Deviasi'],['budget','Anggaran'],['spent','Realisasi']];
  const q=v=>{v=String(v??'');return/[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=scopedProjects().map(p=>cols.map(([k])=>q(k==='_el'?elapsed(p):k==='_var'?variance(p):k==='rag'?RAG[p.rag]:p[k])).join(','));
  const url=URL.createObjectURL(new Blob(['\ufeff'+[cols.map(c=>c[1]).join(','),...rows].join('\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='portofolio-proyek-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('CSV diunduh');
}
function setTab(k){if(storeState!=='ready')return;UI.tab=k;lsSet('pmo.tab',k);try{history.replaceState(null,'','#'+k)}catch(e){}window.scrollTo(0,0);render()}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,c=el.dataset.c,k=el.dataset.k;
  if(a==='pw-eye'){const i=el.parentElement.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';el.setAttribute('aria-pressed',String(show));el.setAttribute('aria-label',(show?'Sembunyikan':'Tampilkan')+(i.id==='lg-key'?' kode':' password'));i.focus();if(i.id==='lg-key')Octo.set(show?'peek':'key',show?'Psst… pastikan tidak ada yang melihat layar Anda.':'Tenang, kodenya tidak saya intip.');return}
  if(a==='scrim'){if(e.target===el&&!modalLock)closeModal();return}
  if(a==='tab')return setTab(k);
  if(a==='close-modal')return closeModal();
  if(a==='open-project'){UI.projectOpen=id;renderDrawer();return}
  if(a==='close-drawer'){UI.projectOpen=null;$('#drawer-root').innerHTML='';return}
  if(a==='add'){const pre={};if(el.dataset.p)pre.projectId=el.dataset.p;if(el.dataset.date)pre.date=el.dataset.date;return openForm(c,null,pre)}
  if(a==='edit'){const it=S[c].find(x=>x.id===id);if(it)openForm(c,it);return}
  if(a==='del'){const it=S[c].find(x=>x.id===id);if(!it)return;return confirmBox('Hapus '+SCHEMA[c].t.toLowerCase()+'?',`<b>${esc(it.title||it.name)}</b> akan dihapus permanen.`+(c==='vendors'&&vDocs(it).length?` ${vDocs(it).length} dokumen milik vendor ini juga ikut terhapus.`:''),'Hapus',async()=>{
      if(await del(c,id))toast(SCHEMA[c].t+' dihapus')})}
  if(a==='del-project'){const p=proj(id);if(!p)return;const n=['milestones','meetings','risks'].reduce((s,c2)=>s+S[c2].filter(x=>x.projectId===id).length,0);
    return confirmBox('Hapus proyek?',`<b>${esc(p.code)} ${esc(p.name)}</b> beserta ${n} milestone, meeting, dan risiko terkait akan dihapus permanen. Vendor dan dokumen tetap disimpan tanpa tautan proyek.`,'Hapus proyek',async()=>{UI.projectOpen=null;$('#drawer-root').innerHTML='';if(await call('deleteProject',id))toast('Proyek dihapus')})}
  if(a==='ms-cycle'){const m=S.milestones.find(x=>x.id===id);if(!m)return;const nx=MS_STAT[(MS_STAT.indexOf(m.status)+1)%MS_STAT.length];el.textContent=nx;return patch('milestones',id,{status:nx})}
  if(a==='cal-nav'){const n=+k;if(n===0){const d=new Date();UI.calMonth=new Date(d.getFullYear(),d.getMonth(),1);UI.calDay=today()}else UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()+n,1);return render()}
  if(a==='cal-day'){UI.calDay=k&&UI.calDay!==k?k:null;return render()}
  if(a==='risk-cell'){UI.riskCell=k&&UI.riskCell!==k?k:null;return render()}
  if(a==='upload')return openUpload(id);
  if(a==='chat-toggle')return CHAT.open?chatClose():chatOpen(null);
  if(a==='chat-open'){UI.projectOpen=null;$('#drawer-root').innerHTML='';return chatOpen(k)}
  if(a==='chat-admin'){if(CHAT.admin){CHAT.admin='';renderChatShell();return toast('Mode admin dinonaktifkan')}return chatAdminPrompt()}
  if(a==='chat-status'){const m=CHAT.msgs.find(x=>x.id===id);if(!m)return;const st=m.status==='Selesai'?'Open':'Selesai';m.status=st;renderChatList();
    return B.setChatStatus(id,st).then(()=>{clearTimeout(CHAT.timer);chatPoll()}).catch(e=>{toast(e.message,true)})}
  if(a==='chat-retry'){const m=CHAT.pending.find(x=>x.id===id);if(m)chatSend(m);return}
  if(a==='chat-del')return confirmBox('Hapus pesan?','Isi pesan akan dihapus untuk semua anggota tim.','Hapus',async()=>{try{await B.deleteChat(CHAT.admin,id);clearTimeout(CHAT.timer);await chatPoll();toast('Pesan dihapus')}catch(e){toast(e.message,true);if(e.code==='ADMIN_AUTH'){CHAT.admin='';renderChatShell()}}});
  if(a==='chat-clear')return confirmBox('Bersihkan semua diskusi?','Seluruh pesan dan catatan revisi akan dihapus permanen untuk semua anggota tim. Tindakan ini tidak bisa dibatalkan.','Hapus semua',async()=>{try{const cr=await B.clearChat(CHAT.admin);CHAT.msgs=[];CHAT.since='';CHAT.cleared=(cr&&cr.cleared)||'';clearTimeout(CHAT.timer);await chatPoll();renderChatList();toast('Diskusi dibersihkan')}catch(e){toast(e.message,true);if(e.code==='ADMIN_AUTH'){CHAT.admin='';renderChatShell()}}});
  if(a==='deck-add')return openDeckForm(null);
  if(a==='deck-edit'){const d=S.decks.find(x=>x.id===id);if(d)openDeckForm(d);return}
  if(a==='deck-open')return openDeck(id);
  if(a==='deck-save')return saveDeckFile(id);
  if(a==='deck-del'){const d=S.decks.find(x=>x.id===id);if(!d)return;return confirmBox('Hapus deck?',`<b>${esc(d.title)}</b> akan dihapus${d.kind!=='link'&&MODE==='remote'?' dan filenya dipindahkan ke Sampah Google Drive':''}.`,'Hapus',async()=>{if(await del('decks',id)){DocCache.del('deck:'+id);toast('Deck dihapus')}})}
  if(a==='up-toggle'){upCollapsed=!upCollapsed;return renderUploads()}
  if(a==='up-close'){for(let i=UPQ.length-1;i>=0;i--)if(UPQ[i].state==='done'||UPQ[i].state==='error')UPQ.splice(i,1);return renderUploads()}
  if(a==='up-retry'){const u=UPQ.find(x=>x.id===id);if(u){u.state='wait';u.err='';u.t0=0;u.t1=0;renderUploads();pumpUploads()}return}
  if(a==='doc-view')return viewDoc(id);
  if(a==='doc-save')return saveDoc(id);
  if(a==='doc-del'){const d=S.documents.find(x=>x.id===id);if(!d)return;return confirmBox('Hapus dokumen?',`<b>${esc(d.name)}</b> akan dihapus dari arsip${MODE==='remote'?' dan dipindahkan ke Sampah Google Drive':''}.`,'Hapus',async()=>{if(await del('documents',id)){DocCache.del(id);if(blobCache[id]){URL.revokeObjectURL(blobCache[id]);delete blobCache[id]}toast('Dokumen dihapus')}})}
  if(a==='export')return exportCSV();
  if(a==='sync')return sync();
  if(a==='retry'){storeState='loading';render();return loadAll()}
  if(a==='logout')return logout('');
  if(a==='clear-ex'){let n=0;COLS.forEach(c2=>n+=S[c2].filter(x=>x.example).length);return confirmBox('Hapus semua data contoh?',`${n} entri bertanda contoh akan dihapus. Data yang sudah Anda edit atau tambahkan sendiri tetap aman.`,'Hapus data contoh',async()=>{UI.projectOpen=null;$('#drawer-root').innerHTML='';if(await call('clearExamples'))toast('Data contoh dihapus')})}
});
document.addEventListener('change',e=>{
  if(e.target.id==='scope'){UI.scope=e.target.value;UI.riskCell=null;render()}
  if(e.target.id==='doc-type'){UI.docType=e.target.value;render()}
  if(e.target.id==='dk-fst'){DUI.st=e.target.value;render()}
  if(e.target.id==='dk-fcat'){DUI.cat=e.target.value;render()}
});
let qT=0;document.addEventListener('input',e=>{if(e.target.id==='dk-q'){clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{DUI.q=v;render();const i=$('#dk-q');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},250);return}if(e.target.id==='doc-q'){clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{UI.docQ=v;render();const i=$('#doc-q');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modalLock)return;if($('#modal-root').innerHTML)closeModal();else if(CHAT.open)chatClose();else if(UI.projectOpen){UI.projectOpen=null;$('#drawer-root').innerHTML=''}}});
/* drag & drop onto vendor cards */
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&assets){e.preventDefault();document.querySelectorAll('.vcard.drag').forEach(x=>x!==c&&x.classList.remove('drag'));c.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drag')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('drag');if(e.dataTransfer&&e.dataTransfer.files.length)openUpload(c.dataset.drop,e.dataTransfer.files)});

boot();
})();
</script>
