<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Management Dashboard</title>
<meta name="description" content="Project Management Dashboard by Rafael Brahmana: project portfolio, coordination &amp; monitoring.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Crect width=%2724%27 height=%2724%27 rx=%275%27 fill=%27%23790008%27/%3E%3Cpath d=%27M5 19h14M7 19v-7M17 19v-7M10 19v-5M14 19v-5M4 12l8-5 8 5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%271.8%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: CIMB Niaga brand header (logo + maroon tab rail) over a 12-col panel grid; 12-col panel grid, summary on top, registers below */
:root{
  --bg:#F3F3F5; --surface:#FFFFFF; --surface-2:#F7F7F9; --ink:#2B2B2F; --muted:#6E6E75; --faint:#9D9DA3;
  --line:#E8E8EC; --line-2:#D8D8DE; --track:#EEEEF2;
  --th-bg:#FBEEEF; --th-ink:#7A1A22; --th-line:#F1D4D7; --zebra:#FFFAFA; --row-hover:#FCF1F2;
  --band:#FFFFFF; --band-ink:#2B2B2F; --band-muted:#6E6E75; --band-line:#E8E8EC; --band-2:#F7F7F9;
  --accent:#790008; --accent-ink:#FFFFFF; --accent-soft:#F7ECED; --accent-2:#B4474E; --brand-red:#EC1C24; --data:#56616F; --logo-plate:#FFFFFF;
  --hero-a:#8A0A12; --hero-b:#4A0207; --hero-glow:rgba(237,48,36,.45); --hero-ink:#FFFFFF; --hero-soft:rgba(255,255,255,.72); --hero-chip:rgba(255,255,255,.12); --hero-line:rgba(255,255,255,.14); --hero-ring:rgba(255,255,255,.06);
  --g:#2E7D52; --g-soft:#EAF4EE; --a:#A86A12; --a-soft:#FAF1E2; --r:#C62828; --r-soft:#FBECEC;
  --scrim:rgba(20,20,24,.45); --shadow:0 1px 2px rgba(16,16,20,.04),0 6px 20px rgba(16,16,20,.05);
  --f-display:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1B1B1F; --surface-2:#222227; --ink:#EDEDF0; --muted:#A7A7AF; --faint:#76767E;
  --line:#2C2C32; --line-2:#3B3B42; --track:#2A2A30;
  --th-bg:#2B1B1E; --th-ink:#F1A7AD; --th-line:#40262A; --zebra:#1E1B1E; --row-hover:#2A1D20;
  --band:#1B1B1F; --band-ink:#EDEDF0; --band-muted:#A7A7AF; --band-line:#2C2C32; --band-2:#222227;
  --accent:#E46A72; --accent-ink:#1A0507; --accent-soft:#3A1E22; --accent-2:#9C454B; --brand-red:#FF4B4B; --data:#A9B4C2; --logo-plate:#FFFFFF;
  --g:#5CC489; --g-soft:#15291E; --a:#E0A64A; --a-soft:#33280F; --r:#F2706B; --r-soft:#3A1C1C;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1B1B1F; --surface-2:#222227; --ink:#EDEDF0; --muted:#A7A7AF; --faint:#76767E;
  --line:#2C2C32; --line-2:#3B3B42; --track:#2A2A30;
  --th-bg:#2B1B1E; --th-ink:#F1A7AD; --th-line:#40262A; --zebra:#1E1B1E; --row-hover:#2A1D20;
  --band:#1B1B1F; --band-ink:#EDEDF0; --band-muted:#A7A7AF; --band-line:#2C2C32; --band-2:#222227;
  --accent:#E46A72; --accent-ink:#1A0507; --accent-soft:#3A1E22; --accent-2:#9C454B; --brand-red:#FF4B4B; --data:#A9B4C2; --logo-plate:#FFFFFF;
  --g:#5CC489; --g-soft:#15291E; --a:#E0A64A; --a-soft:#33280F; --r:#F2706B; --r-soft:#3A1C1C;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header band */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band-line);box-shadow:0 1px 0 var(--band-line),0 6px 18px rgba(60,10,14,.05)}
.brandbar{height:4px;background:linear-gradient(90deg,var(--accent) 0 72%,var(--brand-red) 72% 100%)}
.logo{display:block;background:var(--logo-plate);border-radius:6px;padding:5px 8px;flex:none}
.logo img{display:block;height:30px;width:auto}
.sep{width:1px;height:34px;background:var(--line-2);flex:none}
@media (max-width:640px){.sep,.brand p{display:none}.logo img{height:24px}.band{position:static}}
.band-in{max-width:1360px;margin:0 auto;padding-inline:20px}
.band-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.brand{min-width:0}
.brand h1{font-size:17px;font-weight:600;color:var(--band-ink);letter-spacing:-.01em;line-height:1.25}
.brand p{margin:0;font-size:12px;color:var(--band-muted)}
.band-tools{margin-left:auto;display:flex;gap:12px;align-items:center}
.clock{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px 0 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--band-line)}
.clock-ic{width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.clock-txt{display:grid;line-height:1.15}
.clock-t{font-size:15px;font-weight:600;color:var(--band-ink);font-variant-numeric:tabular-nums;letter-spacing:.01em;display:flex;align-items:baseline;gap:5px}
.clock-t .tz{font-size:10px;font-weight:600;color:var(--accent);letter-spacing:.06em}
.clock-d{font-size:11px;color:var(--band-muted);white-space:nowrap}
.vsep{width:1px;height:30px;background:var(--band-line);flex:none}
.who{display:flex;align-items:center;gap:10px;height:42px}
.av{position:relative;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:var(--a);border:2px solid var(--band)}
.who.live .av::after{background:var(--g)}
.who-txt{display:grid;line-height:1.2;min-width:0}
.who-txt b{font-size:13px;font-weight:600;color:var(--band-ink);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--band-muted)}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--a);flex:none}
.mode.live i{background:var(--g);box-shadow:0 0 0 3px var(--g-soft)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 10px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--band-ink);cursor:pointer;font-weight:500;font-size:13px}
.ibtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn.out{padding:0 12px}
.ibtn[disabled]{opacity:.6;cursor:progress}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ibtn.spin svg{animation:none}}
.tabrow{display:flex;align-items:flex-end;gap:16px}
.tabrow .tabs{flex:1;min-width:0}
.scope-wrap{display:flex;align-items:center;gap:8px;padding-bottom:7px;flex:none}
.scope-wrap label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--band-muted)}
@media (max-width:1180px){.clock-d{display:none}.clock{height:38px}.brand p{display:none}.logo img{height:26px}.ibtn.out span{display:none}.ibtn.out{padding:0 10px}.scope-wrap label{display:none}.scope-wrap .scope{max-width:190px}}
@media (max-width:860px){.band-top{row-gap:10px}.band-tools{margin-left:0;width:100%;justify-content:flex-start}.clock{margin-right:auto}.vsep{display:none}.tabrow{flex-direction:column-reverse;align-items:stretch;gap:0}.scope-wrap{padding:0 0 4px;min-width:0}.scope-wrap .scope{flex:1;min-width:0;width:100%;max-width:none}}
@media (max-width:560px){.who-txt{display:none}.band-tools{gap:8px}.clock{flex:1;min-width:0;padding:0 10px}.ibtn.out span{display:none}.ibtn.out{padding:0 10px}}
/* Login */
body.pre-auth .tabrow,body.pre-auth .band-tools,body.pre-auth .brand p{display:none}
body.pre-auth .band-top{padding-block:16px 16px}
.auth{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);max-width:1080px;margin:28px auto 8px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.auth-hero{position:relative;padding:44px 44px 36px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,var(--hero-glow) 0%,transparent 55%),linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 100%);display:flex;flex-direction:column;gap:14px;overflow:hidden;isolation:isolate}
.auth-hero::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:36px 36px;mask-image:linear-gradient(160deg,rgba(0,0,0,.9),transparent 70%);-webkit-mask-image:linear-gradient(160deg,rgba(0,0,0,.9),transparent 70%)}
.auth-hero::after{content:"";position:absolute;right:-90px;bottom:-110px;width:320px;height:320px;border-radius:50%;border:44px solid var(--hero-ring);z-index:-1}
.auth-greet{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--hero-chip);font-variant-numeric:tabular-nums}
.auth-greet .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
.auth-greet #au-tz{font-size:10.5px;font-weight:600;letter-spacing:.06em;opacity:.8}
.auth-hero h2{font-size:clamp(26px,3vw,34px);font-weight:700;line-height:1.15;letter-spacing:-.02em;margin-top:6px;color:var(--hero-ink)}
.auth-hero .auth-for{margin:6px 0 0;font-size:clamp(16px,1.6vw,19px);font-weight:500;letter-spacing:-.01em;color:var(--hero-ink);opacity:.92}.auth-hero .auth-for span{font-weight:300;font-style:italic;opacity:.8;margin-right:2px}
.auth-org{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--hero-soft)}
.auth-lead{margin:0;font-size:15px;line-height:1.6;max-width:42ch;color:var(--hero-ink);opacity:.92}
.auth-feat{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.auth-feat li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center}
.auth-feat svg{width:36px;height:36px;padding:8px;border-radius:10px;background:var(--hero-chip);fill:none;stroke:var(--hero-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auth-feat b{display:block;font-size:13.5px;font-weight:600;color:var(--hero-ink)}
.auth-feat span{display:block;font-size:12px;color:var(--hero-soft)}
.auth-date{margin-top:auto;padding-top:18px;font-size:12px;color:var(--hero-soft);border-top:1px solid var(--hero-line)}
.auth-card{padding:44px 40px;display:flex;flex-direction:column;justify-content:center;gap:16px;background:var(--surface)}
.auth-card h3{font-size:26px;font-weight:700;margin:4px 0 2px;letter-spacing:-.02em}
.auth-card p.muted{margin:0;font-size:13.5px}
.auth-card .fld input{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:12px 14px;width:100%;font-size:14px}
.auth-card .fld input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.auth-card .err:empty{display:none}
.auth-go{justify-content:center;padding:12px;border-radius:10px;font-size:14px}
.auth-note{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--faint)}
.auth-note svg{width:15px;height:15px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Octo mascot (login) */
.octo-stage{display:flex;align-items:center;gap:16px;margin:-6px 0 2px}
.octo{position:relative;width:132px;height:132px;flex:none;--lx:0}
.octo-fig{position:absolute;inset:0 0 10px;animation:octoFloat 3.6s ease-in-out infinite}
.octo-look{position:absolute;inset:0;transform:rotate(calc(var(--lx)*7deg)) translateX(calc(var(--lx)*4px));transition:transform .5s cubic-bezier(.22,1,.36,1)}
.octo-lean{position:absolute;inset:0;transform-origin:50% 92%;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.octo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;transform:scale(.84) translateY(8px);transition:opacity .2s ease,transform .5s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 6px 10px rgba(120,0,10,.16));user-select:none;-webkit-user-drag:none;pointer-events:none}
.octo img.on{opacity:1;transform:none}
.octo-shadow{position:absolute;left:50%;bottom:2px;width:74px;height:12px;margin-left:-37px;border-radius:50%;background:radial-gradient(closest-side,rgba(60,0,8,.28),transparent);animation:octoShadow 3.6s ease-in-out infinite}
.octo-fx{position:absolute;left:50%;top:38%;width:0;height:0;pointer-events:none}
.octo-fx b{position:absolute;width:7px;height:11px;border-radius:2px;background:var(--c);opacity:0;animation:octoConf 1.15s cubic-bezier(.16,.84,.44,1) forwards;animation-delay:var(--d)}
.octo[data-st="idle"] .octo-lean,.octo[data-st="name"] .octo-lean{animation:octoHi 4.6s ease-in-out infinite}
.octo[data-st="key"] .octo-lean{transform:rotate(-7deg) translateX(-3px)}
.octo[data-st="peek"] .octo-lean{transform:scale(1.04) translateY(-2px)}
.octo[data-st="busy"] .octo-fig{animation:octoBusy .9s ease-in-out infinite}
.octo.fx[data-st="err"] .octo-lean{animation:octoNo .6s ease-in-out}
.octo.fx[data-st="ok"] .octo-fig{animation:octoJump .95s cubic-bezier(.3,.7,.4,1)}
.octo.fx[data-st="ok"] .octo-shadow{animation:octoJumpSh .95s cubic-bezier(.3,.7,.4,1)}
.octo-say{position:relative;max-width:240px;padding:10px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--ink);font-weight:500;transform-origin:0 50%}
.octo-say::before{content:"";position:absolute;left:-6px;top:50%;width:10px;height:10px;margin-top:-5px;background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.octo-say.pop{animation:octoSay .42s cubic-bezier(.34,1.56,.64,1)}
@keyframes octoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes octoShadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.6}}
@keyframes octoHi{0%,62%,100%{transform:rotate(0)}68%{transform:rotate(-6deg)}74%{transform:rotate(5deg)}80%{transform:rotate(-4deg)}86%{transform:rotate(2deg)}92%{transform:rotate(0)}}
@keyframes octoBusy{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes octoNo{0%,100%{transform:translateX(0)}15%{transform:translateX(-9px) rotate(-5deg)}35%{transform:translateX(8px) rotate(4deg)}55%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(3px)}}
@keyframes octoJump{0%{transform:translateY(0) scale(1)}14%{transform:translateY(4px) scale(1.08,.9)}44%{transform:translateY(-34px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.06,.93)}84%{transform:translateY(-6px) scale(1)}100%{transform:translateY(0)}}
@keyframes octoJumpSh{0%,100%{transform:scale(1)}44%{transform:scale(.55);opacity:.4}70%{transform:scale(1.1)}}
@keyframes octoConf{0%{opacity:1;transform:translate(0,0) rotate(0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
@keyframes octoSay{0%{opacity:0;transform:scale(.88) translateX(-6px)}100%{opacity:1;transform:none}}
@media (max-width:560px){.octo{width:96px;height:96px}.octo-shadow{width:58px;margin-left:-29px}.octo-say{font-size:12.5px}.octo-stage{gap:12px}}
@media (prefers-reduced-motion:reduce){.octo-fig,.octo-shadow,.octo-lean,.octo-say.pop,.octo.fx .octo-fig,.octo.fx .octo-lean,.octo.fx .octo-shadow{animation:none!important}.octo-look{transition:none;transform:none}.octo-fx{display:none}}
@media (max-width:900px){.auth{grid-template-columns:1fr;margin-top:12px}.auth-hero{padding:32px 28px 26px}.auth-card{padding:32px 28px}}
@media (max-width:560px){.auth-feat,.auth-date{display:none}.auth-hero{padding:26px 22px}.auth-card{padding:26px 22px}.auth{border-radius:14px}}
.err{color:var(--r);font-size:13px;min-height:1.2em}
.scope{background:var(--surface);color:var(--band-ink);border:1px solid var(--line-2);border-radius:10px;height:36px;padding:0 12px;max-width:280px;font-size:13px;cursor:pointer}
.scope:hover{border-color:var(--accent)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--band-muted);padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--band-ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab[aria-selected="true"] .ct{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tab .ct{font-family:var(--f-mono);font-size:11px;background:var(--band-2);border:1px solid var(--band-line);border-radius:10px;padding:0 6px;color:var(--band-muted)}

/* Page */
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:22px 32px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:1000px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0;box-shadow:0 1px 2px rgba(16,16,20,.03)}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.ph h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--brand-red),var(--accent));flex:none}
.ph .sub{font-size:12px;color:var(--muted)}
.ph .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{font-size:20px;font-weight:600;margin-right:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--r)} .btn.danger:hover{border-color:var(--r);color:var(--r)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;letter-spacing:.01em;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.g{background:var(--g-soft);color:var(--g);border-color:transparent}
.chip.a{background:var(--a-soft);color:var(--a);border-color:transparent}
.chip.r{background:var(--r-soft);color:var(--r);border-color:transparent}
.chip.i{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--faint);border:1px dashed var(--line-2);border-radius:4px;padding:0 4px}

/* Insight band */
.insights{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.insights li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px}
.ic.r{background:var(--r-soft);color:var(--r)} .ic.a{background:var(--a-soft);color:var(--a)} .ic.g{background:var(--g-soft);color:var(--g)} .ic.i{background:var(--accent-soft);color:var(--accent)}
.insights b{font-weight:600}
@media (min-width:1001px){.insights{grid-template-columns:1fr 1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:grid;gap:5px;min-width:0;box-shadow:0 1px 2px rgba(16,16,20,.03)}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand-red))}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .c{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--r)} .kpi.amber .v{color:var(--a)}
.meter{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.legend{display:grid;gap:10px;flex:1;min-width:160px}
.phase{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:9px}
.phase .eyebrow{margin-bottom:2px}
.ph-row{display:grid;grid-template-columns:96px 1fr 24px;gap:10px;align-items:center;font-size:12.5px}
.ph-row .num{text-align:right;color:var(--muted)}
.ph-bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.ph-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.legend .row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
.legend .sw{width:12px;height:12px;border-radius:3px}

/* Health table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0}
th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--th-ink);font-weight:600;text-align:left;padding:11px 12px;background:var(--th-bg);border-bottom:2px solid var(--th-line);white-space:nowrap}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:var(--zebra)}
tr.click{cursor:pointer} tbody tr:hover td{background:var(--row-hover)}
tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
td.r,th.r{text-align:right}
.pname{font-weight:600;line-height:1.3}
.pbar{position:relative;height:6px;background:var(--track);border-radius:3px;min-width:120px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.pbar i.g{background:var(--g)} .pbar i.a{background:var(--a)} .pbar i.r{background:var(--r)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.var.pos{color:var(--g)} .var.neg{color:var(--r)} .var.mid{color:var(--a)}
.stepper{display:flex;gap:3px;align-items:center}
.stepper i{width:14px;height:5px;border-radius:2px;background:var(--line-2)}
.stepper i.on{background:var(--accent)}
.stepper i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* Budget bars */
.bud{display:grid;gap:14px}
.bud .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center}
@media (max-width:560px){.bud .row{grid-template-columns:1fr}}
.bud .lab{min-width:0}
.bud .lab .code{display:block}
.bud .lab span.n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.btrack{position:relative;height:14px;background:var(--track);border-radius:7px}
.btrack .bgt{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--line-2)}
.btrack .spt{position:absolute;left:0;top:3px;bottom:3px;border-radius:4px;background:var(--data)}
.btrack .spt.over{background:var(--r)}
.btrack .ev{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--accent)}
.bmeta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg i{display:inline-block;width:12px;height:8px;border-radius:2px}

/* Heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;font-size:11px}
.heat .ax{display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono)}
.hc{aspect-ratio:1.6;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;border:1px solid var(--line);max-width:100%;background:var(--surface-2);color:var(--faint);position:relative}
.hc.lo:not(.zero){background:var(--g-soft);color:var(--g);border-color:transparent} .hc.md:not(.zero){background:var(--a-soft);color:var(--a);border-color:transparent} .hc.hi:not(.zero){background:var(--r-soft);color:var(--r);border-color:transparent}
.hc.zero{color:var(--faint);font-weight:400}
button.hc{cursor:pointer}
button.hc.sel{border-color:var(--ink)}
.heat-x{display:flex;justify-content:space-between;margin:6px 0 0 32px;font-size:11px;color:var(--muted)}

/* Lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.datebox{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 0;background:var(--surface-2)}
.datebox .m{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.datebox .d{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.li .t{font-weight:600;line-height:1.3}
.li .s{font-size:12px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:8px;display:grid;gap:8px;justify-items:center}

/* Gantt */
.gantt{min-width:820px}
.g-row{display:grid;grid-template-columns:230px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-lab{padding:10px 12px 10px 0;min-width:0}
.g-lab .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.g-track{position:relative;height:54px}
.g-months{position:relative;height:28px}
.g-months span{position:absolute;top:6px;font-size:11px;color:var(--muted);font-family:var(--f-mono);padding-left:6px;border-left:1px solid var(--line);height:22px;white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-bar{position:absolute;top:17px;height:20px;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);cursor:pointer}
.g-bar .f{position:absolute;left:0;top:0;bottom:0;opacity:.9}
.g-bar .f.g{background:var(--g)} .g-bar .f.a{background:var(--a)} .g-bar .f.r{background:var(--r)}
.g-bar .lbl{position:relative;font-size:11px;font-family:var(--f-mono);padding:0 6px;line-height:18px;color:var(--ink);font-weight:500;white-space:nowrap}
.g-ms{position:absolute;top:9px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);border:2px solid var(--ink);background:var(--surface)}
.g-ms.done{background:var(--ink)} .g-ms.late{border-color:var(--r);background:var(--r)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--r);opacity:.75}
.g-today-lab{position:absolute;top:-2px;transform:translateX(-50%);font-size:10px;font-family:var(--f-mono);color:var(--surface);background:var(--r);padding:0 5px;border-radius:3px;white-space:nowrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cday{min-height:86px;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cday:hover{border-color:var(--accent-2)}
.cday.out{background:var(--surface-2);color:var(--faint)}
.cday.tod{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday.sel{background:var(--accent-soft)}
.cday .n{font-family:var(--f-mono);font-size:12px;font-weight:500}
.cday .ev{font-size:11px;line-height:1.25;padding:2px 4px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cday .more{font-size:11px;color:var(--muted)}
@media (max-width:640px){.cday{min-height:52px}.cday .ev{display:none}.cday.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}}

.mcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mcard + .mcard{margin-top:10px}
.mcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mcard .t{font-weight:600;font-size:14px;line-height:1.3}
.mcard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mcard details summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.mcard .body{display:grid;gap:8px;margin-top:8px;font-size:13px}
.mcard .body h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mcard .body p{margin:0;white-space:pre-wrap}
.mcard ul{margin:0;padding-left:18px}
.mcard .acts{display:flex;gap:6px;margin-left:auto}

/* Vendors */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
@media (max-width:420px){.vgrid{grid-template-columns:1fr}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0;transition:border-color .15s,box-shadow .15s}
.vcard:hover{border-color:var(--line-2)}
.vcard.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vc-h{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}
.vc-av{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.02em}
.vc-t h3{font-size:16px;font-weight:600;line-height:1.25;margin:0;overflow-wrap:anywhere}
.vc-tags{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px}
.vc-cat{font-size:12px;color:var(--muted)}
.vc-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vc-stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;display:grid;gap:1px}
.vc-stat .k{font-size:11px;color:var(--muted)}
.vc-stat .v{font-size:15.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35;overflow-wrap:anywhere}
.vc-stat .s{font-size:11.5px;color:var(--muted)}
.vc-stat .s.warn{color:var(--a);font-weight:600}
.vc-info{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0;font-size:13px;align-items:baseline}
.vc-info dt{color:var(--muted);font-size:12px}
.vc-info dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.vc-note{margin:0;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:9px 12px;border-radius:10px;border-left:3px solid var(--line-2)}
.vc-docs{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.vc-docs-h{display:flex;align-items:center;gap:10px}
.vc-prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.vc-prog .bar{width:56px;height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.vc-prog .bar i{display:block;height:100%;background:var(--g);border-radius:3px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:12.5px}
.kv div{min-width:0}
.kv .k{font-size:11px;color:var(--muted);display:block}
.kv .val{overflow-wrap:anywhere}
.stars{color:var(--a);letter-spacing:1px}
.stars .off{color:var(--line-2)}
.req{display:flex;gap:6px;flex-wrap:wrap}
.doc2{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 8px 10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:background .15s,border-color .15s}
.doc2:hover{background:var(--surface-2);border-color:var(--line-2)}
.doc2 .fi,.upi .fi{width:34px;height:40px;border-radius:6px;background:var(--r-soft);color:var(--r);display:grid;place-items:center;font-size:9.5px;font-weight:700;letter-spacing:.04em}
.doc2 .fi.img{background:var(--accent-soft);color:var(--accent)}
.d-name{all:unset;cursor:pointer;font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;color:var(--ink)}
.d-name:hover{color:var(--accent);text-decoration:underline}
.d-name:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.d-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:11.5px;color:var(--muted)}
.d-meta .chip{font-size:10.5px;padding:1px 8px}
.d-acts{display:flex;gap:2px}
.icb{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.icb:hover{background:var(--surface);border-color:var(--line-2);color:var(--accent)}
.icb.danger:hover{color:var(--r);background:var(--r-soft);border-color:transparent}
.icb svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.drop2{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px dashed var(--line-2);border-radius:10px;background:none;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.drop2:hover,.vcard.drag .drop2{border-color:var(--accent);background:var(--accent-soft)}
.drop2 svg{width:36px;height:36px;padding:8px;border-radius:50%;background:var(--accent-soft);flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.drop2:hover svg{background:var(--surface)}
.drop2 b{display:block;font-size:13px;font-weight:600}
.drop2 > span > span{display:block;font-size:11.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}

/* Upload panel */
#upload-root .upw{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:45;width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(30,10,12,.18);overflow:hidden}
.upw-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.upw-h b{font-size:13px;font-weight:600;flex:1;min-width:0}
.upw-acts{display:flex;gap:6px}
.ibtn.sm{height:28px;min-width:28px;padding:0 6px;border-radius:8px;font-size:12px}
.upw-list{max-height:320px;overflow-y:auto;padding:6px 14px}
.upi{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:7px}
.upi:last-child{border-bottom:0}
.upi-top{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center}
.upi .fi{width:28px;height:32px;border-radius:4px;background:var(--r-soft);color:var(--r);display:grid;place-items:center;font-size:8.5px;font-weight:700}
.upi .fi.img{background:var(--accent-soft);color:var(--accent)}
.upi-name{min-width:0}
.upi-name b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upi-name span{font-size:11px;color:var(--muted)}
.upi-pct{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent)}
.upi.done .upi-pct{color:var(--g)}.upi.error .upi-pct{color:var(--r)}
.upi-bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.upi-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s linear}
.upi.done .upi-bar i{background:var(--g)}.upi.error .upi-bar i{background:var(--r)}.upi.wait .upi-bar i{width:0}
.upi-st{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.upi.error .upi-st{color:var(--r)}
.upw-f{padding:9px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--surface-2)}
@media (prefers-reduced-motion:reduce){.upi-bar i{transition:none}}

/* Document loading */
.dl-simple{display:flex;align-items:center;gap:14px;padding:18px}
.dl-simple b{display:block;font-size:14px;font-weight:600}
.dl-simple span:not(.spin){display:block;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#cf-ok[disabled]{opacity:1;cursor:progress}

<script>
(function(){
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS=['projects','milestones','meetings','vendors','documents','risks','decks'];
const S={};COLS.forEach(c=>S[c]=[]);
const loaded={};
let storeState='loading',errMsg='',busy=0,lastSync=null;const assets=true,downloads=true;
const UI={tab:'overview',scope:'all',calMonth:null,calDay:null,riskCell:null,docQ:'',docType:'',projectOpen:null};

const TABS=[['overview','Ringkasan'],['projects','Proyek'],['timeline','Timeline'],['meetings','Meeting'],['vendors','Vendor & Dokumen'],['risks','Risiko'],['decks','Deck & PPT']];
const PHASES=['Inisiasi','Perencanaan','Eksekusi','UAT','Go-Live','Selesai'];
const RAG={g:'On track',a:'Perlu perhatian',r:'Kritis'};
const MS_STAT=['Belum mulai','Berjalan','Selesai','Terblokir'];
const MEET_TYPES=['Internal','Steering Committee','Weekly Progress','Vendor Meeting','Workshop / Requirement','UAT Review','Koordinasi tim','Lainnya'];
const V_CAT=['Software / Core System','System Integrator','Konsultan','Infrastruktur / Cloud','Data & Analytics','Lainnya'];
const V_STAT=['Evaluasi / RFP','Negosiasi','PKS ditandatangani','Aktif','Selesai'];
const DOC_TYPES=['NDA','Proposal / RFP','PKS / Kontrak','Invoice','BAST','Notulen','Lainnya'];
const R_CAT=['Teknologi','Regulasi / Compliance','Vendor','Jadwal','Anggaran','Operasional'];
const R_STAT=['Open','Mitigasi berjalan','Closed'];
const SEG=['Corporate Banking','Commercial Banking','Transaction Banking','Cash Management','Trade Finance'];
const MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_L=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const fmtDate=s=>{const d=parseD(s);return d?d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear():'—'};
const fmtDS=s=>{const d=parseD(s);return d?d.getDate()+' '+MONTHS[d.getMonth()]:'—'};
const n1=x=>x.toLocaleString('id-ID',{maximumFractionDigits:1});
const rp=v=>{v=+v||0;const a=Math.abs(v);if(a>=1e12)return'Rp '+n1(v/1e12)+' T';if(a>=1e9)return'Rp '+n1(v/1e9)+' M';if(a>=1e6)return'Rp '+n1(v/1e6)+' jt';return'Rp '+Math.round(v).toLocaleString('id-ID')};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
const fmtSize=b=>!b?"0 KB":b>=1048576?n1(b/1048576)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const proj=id=>S.projects.find(p=>p.id===id);
const mcode=id=>id&&proj(id)?pcode(id):'Umum';
const pcode=id=>{const p=proj(id);return p?p.code||p.name:'—'};
const inScope=pid=>UI.scope==='all'||pid===UI.scope;
const scopedProjects=()=>S.projects.filter(p=>inScope(p.id)).sort((a,b)=>(a.code||'').localeCompare(b.code||''));
const scoped=c=>S[c].filter(x=>inScope(x.projectId));
const isActive=p=>p.phase!=='Selesai';
function elapsed(p){const t=today();if(!p.start||!p.end)return 0;const tot=diffDays(p.start,p.end);if(tot<=0)return 100;return clamp(Math.round(diffDays(p.start,t)/tot*100),0,100)}
const variance=p=>(+p.progress||0)-elapsed(p);
const rScore=r=>(+r.impact||0)*(+r.likelihood||0);
const rBand=s=>s>=15?'hi':s>=8?'md':'lo';
const rBandChip=s=>s>=15?'r':s>=8?'a':'g';
const rOpen=r=>r.status!=='Closed';
const msLate=m=>m.status!=='Selesai'&&m.due&&m.due<today();
function reqDocs(v){const base=['NDA','Proposal / RFP'];if(['PKS ditandatangani','Aktif'].includes(v.status))return[...base,'PKS / Kontrak'];if(v.status==='Selesai')return[...base,'PKS / Kontrak','BAST'];return base}
const vDocs=v=>S.documents.filter(d=>d.vendorId===v.id);
function ragChip(r){return`<span class="chip ${r||''}"><span class="d"></span>${esc(RAG[r]||'—')}</span>`}
function stepper(phase){const i=PHASES.indexOf(phase);return`<span class="stepper" title="${esc(phase||'')}">${PHASES.slice(0,5).map((_,k)=>`<i class="${k<i||i===5?'on':k===i?'cur':''}"></i>`).join('')}</span>`}
function stars(n){n=+n||0;return`<span class="stars" aria-label="${n} dari 5">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`}
const exTag=x=>x.example?' <span class="ex">contoh</span>':'';

/* ---------- store ---------- */
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
/* ================= Backend: mode tim (Google Sheets) atau mode demo (browser) ================= */
const CFG=window.PMO_CONFIG||{};const API=String(CFG.API_URL||'').trim();
const MODE=/^https:\/\/script\.google\.com\/.+\/exec$/.test(API)?'remote':'local';
const SESSION={key:'',name:''};

  async call(action,...args){
    const ctl=new AbortController();const lim=/upload|getFile/.test(action)?120000:60000;const tm=setTimeout(()=>ctl.abort(),lim);
    let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SESSION.key,who:SESSION.name,action,args}),redirect:'follow',signal:ctl.signal})}
    catch(e){clearTimeout(tm);if(e&&e.name==='AbortError')throw Object.assign(new Error('Server Google terlalu lama merespons. Coba lagi; bila terus terjadi, periksa internet atau status deploy Web App.'),{code:'NET'});throw Object.assign(new Error('Tidak bisa terhubung ke server Google. Periksa internet lalu coba lagi.'),{code:'NET'})}
    clearTimeout(tm);
    if(!r.ok)throw Object.assign(new Error('Server Google tidak merespons (kode '+r.status+'). Coba lagi sebentar lagi.'),{code:'NET'});
    let j;try{j=await r.json()}catch(e){throw Object.assign(new Error('Balasan server tidak terbaca. Pastikan Web App di-deploy dengan akses "Anyone".'),{code:'NET'})}
    if(!j.ok)throw Object.assign(new Error(j.error||'Terjadi kesalahan di server.'),{code:j.code||'ERROR'});
    return j.data;
  },

const IDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{const q=indexedDB.open('pmo-desk-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)})},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('files',mode);const st=t.objectStore('files');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(k,v){return this.tx('readwrite',st=>st.put(v,k))},get(k){return this.tx('readonly',st=>st.get(k))},del(k){return this.tx('readwrite',st=>st.delete(k))}};
const Local={
  data:null,
  load(){if(this.data)return this.data;let d=null;try{d=JSON.parse(lsGet('pmo.local.v1')||'null')}catch(e){}
    if(!d||typeof d!=='object'){d=JSON.parse(JSON.stringify(SEED));d.documents=d.documents||[]}
    COLS.forEach(c=>{if(!Array.isArray(d[c]))d[c]=[]});this.data=d;return d},
  save(){try{localStorage.setItem('pmo.local.v1',JSON.stringify(this.data))}catch(e){throw new Error('Penyimpanan browser penuh atau diblokir. Data demo tidak tersimpan.')}},
  out(){return JSON.parse(JSON.stringify(Object.assign({},this.load(),{meta:{}})))},
  async getAll(){return this.out()},
  async saveItem(c,item){const d=this.load();const arr=d[c];const i=item.id?arr.findIndex(x=>x.id===item.id):-1;
    const now={updatedAt:new Date().toISOString(),updatedBy:SESSION.name||''};
    if(i>=0)arr[i]=Object.assign({},arr[i],item,now);else arr.push(Object.assign({example:false},item,{id:item.id||uid(c)},now));
    this.save();return this.out()},
  async deleteItems(list){const d=this.load();const by={};list.forEach(x=>(by[x.col]=by[x.col]||[]).push(x.id));
    if(by.vendors)by.documents=(by.documents||[]).concat(d.documents.filter(x=>by.vendors.includes(x.vendorId)).map(x=>x.id));
    for(const id of by.documents||[]){try{await IDB.del(id)}catch(e){}}
    for(const id of by.decks||[]){try{await IDB.del('deck:'+id)}catch(e){}}
    Object.keys(by).forEach(c=>{d[c]=d[c].filter(x=>!by[c].includes(x.id))});this.save();return this.out()},
  async deleteProject(pid){const d=this.load();['milestones','meetings','risks'].forEach(c=>d[c]=d[c].filter(x=>x.projectId!==pid));
    ['vendors','documents'].forEach(c=>d[c].forEach(x=>{if(x.projectId===pid)x.projectId=''}));d.projects=d.projects.filter(x=>x.id!==pid);this.save();return this.out()},
  async clearExamples(){const d=this.load();for(const x of d.documents.filter(x=>x.example)){try{await IDB.del(x.id)}catch(e){}}
    COLS.forEach(c=>d[c]=d[c].filter(x=>!x.example));this.save();return this.out()},
  async uploadDocument(meta,b64){const d=this.load();const v=d.vendors.find(x=>x.id===meta.vendorId);if(!v)throw new Error('Vendor tidak ditemukan.');
    const id=uid('documents');try{await IDB.put(id,{b64,contentType:meta.contentType,name:meta.name})}catch(e){throw new Error('Browser menolak menyimpan file. Coba browser lain atau nonaktifkan mode private.')}
    d.documents.push({id,vendorId:v.id,projectId:v.projectId||'',name:meta.name,docType:meta.docType,note:meta.note||'',fileId:id,size:Math.round(b64.length*3/4),contentType:meta.contentType,uploadedAt:new Date().toISOString(),example:false,updatedBy:SESSION.name||''});
    this.save();return this.out()},
  async getFile(id){const f=await IDB.get(id);if(!f)throw new Error('File tidak ditemukan di browser ini.');return f},

    const row=Object.assign({},meta,{id,kind:'file',url:'',fileId:'deck:'+id,size:Math.round(b64.length*3/4),updatedAt:new Date().toISOString(),updatedBy:SESSION.name||''});

function insights(){
  const t=today(),out=[];
  const act=scopedProjects().filter(isActive);
  if(!act.length)return[{l:'i',h:'Belum ada proyek aktif. Tambahkan proyek pertama untuk mulai memantau portofolio.'}];
  const lag=act.map(p=>({p,v:variance(p)})).filter(x=>x.v<=-10).sort((a,b)=>a.v-b.v);
  lag.slice(0,2).forEach(({p,v})=>out.push({l:'r',h:`<b>${esc(p.code)}</b> ${esc(p.name)} tertinggal <b>${-v} poin</b> dari jadwal: progres ${p.progress}% sementara ${elapsed(p)}% waktu sudah berjalan.`}));
  const late=scoped('milestones').filter(msLate).sort((a,b)=>a.due.localeCompare(b.due));
  if(late.length)out.push({l:'r',h:`<b>${late.length} milestone lewat tenggat</b>: ${late.slice(0,3).map(m=>`${esc(m.title)} (${esc(pcode(m.projectId))}, ${-diffDays(t,m.due)} hari)`).join('; ')}${late.length>3?', dan lainnya':''}.`});
  const burn=act.filter(p=>+p.budget>0&&pct(p.spent,p.budget)-(+p.progress||0)>=8).sort((a,b)=>(pct(b.spent,b.budget)-b.progress)-(pct(a.spent,a.budget)-a.progress));
  burn.slice(0,2).forEach(p=>out.push({l:'a',h:`Serapan anggaran <b>${esc(p.code)}</b> ${pct(p.spent,p.budget)}% melampaui progres ${p.progress}%. Selisih ${rp(+p.spent-(+p.budget*(+p.progress||0)/100))} perlu dicek terhadap potensi cost overrun.`}));
  const hi=scoped('risks').filter(r=>rOpen(r)&&rScore(r)>=15).sort((a,b)=>rScore(b)-rScore(a));
  if(hi.length)out.push({l:'r',h:`<b>${hi.length} risiko skor tinggi</b> masih terbuka. Teratas: ${esc(hi[0].title)} (${esc(pcode(hi[0].projectId))}, skor ${rScore(hi[0])}).`});
  const noMom=scoped('meetings').filter(m=>m.date<t&&!String(m.mom||'').trim());
  if(noMom.length)out.push({l:'a',h:`<b>${noMom.length} meeting</b> sudah berlangsung tanpa notulen: ${noMom.slice(0,2).map(m=>esc(m.title)).join(', ')}${noMom.length>2?', dan lainnya':''}.`});
  const vs=S.vendors.filter(v=>inScope(v.projectId));
  const ending=vs.filter(v=>v.contractEnd&&v.status!=='Selesai'&&diffDays(t,v.contractEnd)>=0&&diffDays(t,v.contractEnd)<=60);
  ending.forEach(v=>out.push({l:'a',h:`Kontrak <b>${esc(v.name)}</b> berakhir ${fmtDate(v.contractEnd)} (${diffDays(t,v.contractEnd)} hari lagi). Siapkan perpanjangan atau BAST.`}));
  const noPks=vs.filter(v=>['Aktif','PKS ditandatangani'].includes(v.status)&&!vDocs(v).some(d=>d.docType==='PKS / Kontrak'));
  if(noPks.length)out.push({l:'a',h:`PKS belum diarsipkan untuk <b>${noPks.length} vendor aktif</b>: ${noPks.map(v=>esc(v.name)).join(', ')}.`});
  const nx=scoped('meetings').filter(m=>m.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const wk=nx.filter(m=>m.date<=addDays(t,7));
  if(nx.length)out.push({l:'i',h:`<b>${wk.length} meeting</b> dalam 7 hari ke depan. Berikutnya: ${esc(nx[0].title)}, ${fmtDS(nx[0].date)} ${esc(nx[0].time||'')}.`});
  const ahead=act.filter(p=>variance(p)>=3);
  if(ahead.length)out.push({l:'g',h:`${ahead.map(p=>`<b>${esc(p.code)}</b>`).join(', ')} berjalan di depan jadwal.`});
  if(!out.length)out.push({l:'g',h:'<b>Semua terkendali.</b> Tidak ada proyek tertinggal jadwal, milestone terlambat, risiko tinggi, atau notulen tertunda.'});
  return out.slice(0,8);
}

function donut(act){
  if(!act.length)return emptyBox('Belum ada proyek aktif.');
  const c={g:0,a:0,r:0};act.forEach(p=>{if(c[p.rag]!=null)c[p.rag]++});
  const tot=act.length,R=54,C=2*Math.PI*R;let off=0;
  const segs=['r','a','g'].map(k=>{const len=c[k]/tot*C;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--${k})" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return c[k]?s:''}).join('');
  return`<div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Distribusi status RAG"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface-2)" stroke-width="12"/>${segs}<text x="75" y="72" text-anchor="middle" fill="var(--ink)" style="font:600 26px var(--f-display)">${tot}</text><text x="75" y="92" text-anchor="middle" fill="var(--muted)" style="font:500 11px var(--f-body)">proyek</text></svg>
  <div class="legend">${['g','a','r'].map(k=>`<div class="row"><span class="sw" style="background:var(--${k})"></span><span>${RAG[k]}</span><span class="num">${c[k]} <span class="faint">· ${pct(c[k],tot)}%</span></span></div>`).join('')}</div></div>`;
}
function phaseDist(ps){if(!ps.length)return'';const mx=Math.max(1,...PHASES.map(f=>ps.filter(p=>p.phase===f).length));
  return`<div class="phase"><div class="eyebrow">Proyek per fase</div>${PHASES.map(f=>{const n=ps.filter(p=>p.phase===f).length;return`<div class="ph-row"><span>${esc(f)}</span><span class="ph-bar"><i style="width:${n/mx*100}%"></i></span><span class="num">${n}</span></div>`}).join('')}</div>`}
function healthTable(act){
  if(!act.length)return emptyBox('Belum ada proyek aktif.');
  const rows=act.slice().sort((a,b)=>variance(a)-variance(b)).map(p=>{const v=variance(p),e=elapsed(p),left=p.end?diffDays(today(),p.end):null;
    return`<tr class="click" data-act="open-project" data-id="${esc(p.id)}"><td><span class="code">${esc(p.code)}</span><div class="pname">${esc(p.name)}${exTag(p)}</div></td><td>${ragChip(p.rag)}</td><td style="min-width:150px"><div class="pbar"><i class="${p.rag}" style="width:${clamp(+p.progress||0,0,100)}%"></i><b style="left:calc(${e}% - 1px)"></b></div><div class="bmeta"><span class="num">${p.progress||0}% / ${e}%</span></div></td><td class="r num var ${v>=0?'pos':v>-10?'mid':'neg'}">${v>0?'+':''}${v}</td><td class="r"><span class="num">${fmtDS(p.end)}</span><div class="faint" style="font-size:11.5px">${left==null?'':left>=0?left+' hari lagi':'lewat '+(-left)+' hari'}</div></td></tr>`}).join('');
  return`<div class="tbl-wrap"><table><thead><tr><th>Proyek</th><th>RAG</th><th>Progres / rencana</th><th class="r">Deviasi (poin)</th><th class="r">Target selesai</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function budgetBars(act){
  const ps=act.filter(p=>+p.budget>0);if(!ps.length)return emptyBox('Isi anggaran proyek untuk melihat perbandingan.');
  const mx=Math.max(...ps.map(p=>Math.max(+p.budget,+p.spent||0)));
  return`<div class="bud">${ps.map(p=>{const b=+p.budget,s=+p.spent||0,ev=b*(+p.progress||0)/100,over=s>ev*1.05;

}
function heatmap(risks,interactive){
  const cell=(i,l)=>risks.filter(r=>+r.impact===i&&+r.likelihood===l).length;
  let h='<div class="heat" role="grid" aria-label="Matriks dampak x kemungkinan">';
  for(let i=5;i>=1;i--){h+=`<span class="ax" title="Dampak ${i}">${i}</span>`;for(let l=1;l<=5;l++){const n=cell(i,l),b=rBand(i*l),sel=UI.riskCell===i+'-'+l;
    h+=interactive?`<button class="hc ${b} ${n?'':'zero'} ${sel?'sel':''}" data-act="risk-cell" data-k="${i}-${l}" aria-label="Dampak ${i}, kemungkinan ${l}: ${n} risiko">${n||'·'}</button>`:`<span class="hc ${b} ${n?'':'zero'}" title="Dampak ${i} × Kemungkinan ${l}">${n||'·'}</span>`}}
  return h+`</div><div class="heat-x"><span>Kemungkinan 1 →</span><span>5</span></div><div class="faint" style="font-size:11px;margin-top:2px">Sumbu vertikal: dampak (1–5)</div>`;
}
function meetingRow(m){const d=parseD(m.date);return`<div class="li"><div class="datebox"><div class="m">${MONTHS[d.getMonth()]}</div><div class="d">${d.getDate()}</div></div><div style="min-width:0"><div class="t">${esc(m.title)}${exTag(m)}</div><div class="s">${esc(m.time||'')}${m.duration?' · '+m.duration+' mnt':''} · ${esc(mcode(m.projectId))} · ${esc(m.location||'—')}</div></div><span class="chip i">${esc(m.type||'Meeting')}</span></div>`}

function msRow(m){const late=msLate(m),d=diffDays(today(),m.due);const cls=m.status==='Selesai'?'g':late||m.status==='Terblokir'?'r':m.status==='Berjalan'?'i':'';

/* ---------- meetings ---------- */
function vMeetings(){
  const t=today();
  if(!UI.calMonth){const d=new Date();UI.calMonth=new Date(d.getFullYear(),d.getMonth(),1)}
  const cm=UI.calMonth,y=cm.getFullYear(),mo=cm.getMonth();
  const first=new Date(y,mo,1),startOff=(first.getDay()+6)%7;const gs=new Date(y,mo,1-startOff);
  const ms=scoped('meetings');const by={};ms.forEach(m=>{(by[m.date]=by[m.date]||[]).push(m)});
  Object.values(by).forEach(a=>a.sort((x,z)=>(x.time||'').localeCompare(z.time||'')));
  let cells='';for(let i=0;i<42;i++){const d=new Date(gs);d.setDate(gs.getDate()+i);const k=iso(d),ev=by[k]||[];
    cells+=`<button class="cday ${d.getMonth()!==mo?'out':''} ${k===t?'tod':''} ${UI.calDay===k?'sel':''} ${ev.length?'has':''}" data-act="cal-day" data-k="${k}" aria-label="${d.getDate()} ${MONTHS_L[d.getMonth()]}: ${ev.length} meeting"><span class="n">${d.getDate()}</span>${ev.slice(0,2).map(m=>`<span class="ev" title="${esc(m.time+' '+m.title)}">${esc(m.time||'')} ${esc(m.title)}</span>`).join('')}${ev.length>2?`<span class="more">+${ev.length-2} lagi</span>`:''}</button>`}
  let side,sideTitle;

function meetingCard(m){

    ${v.notes?`<p class="vc-note">${esc(v.notes)}</p>`:''}

      <div class="req">${r.map(x=>`<span class="chip ${have.has(x)?'g':''}">${have.has(x)?'✓':'○'} ${esc(x)}</span>`).join('')}</div>

function docBtns(d){const i=esc(d.id);return`<span class="d-acts"><button class="icb" data-act="doc-view" data-id="${i}" title="Lihat" aria-label="Lihat ${esc(d.name)}">${ic('eye')}</button><button class="icb" data-act="doc-save" data-id="${i}" title="Unduh" aria-label="Unduh ${esc(d.name)}">${ic('dl')}</button><button class="icb danger" data-act="doc-del" data-id="${i}" title="Hapus" aria-label="Hapus ${esc(d.name)}">${ic('trash')}</button></span>`}

const DECK_CAT=['Proposal','Pitch deck','Materi presentasi','Laporan','Lainnya'];
const DECK_STAT=['Draft','Review','Final','Dipresentasikan'];
const DECK_MIME={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',pptx:'application/vnd.openxmlformats-officedocument.presentationml.presentation',ppt:'application/vnd.ms-powerpoint'};
const DUI={q:'',st:'',cat:''};
function deckType(d){
  if(d.kind==='link'){const u=String(d.url||'').toLowerCase();
    if(/docs\.google\.com\/presentation|slides\.google/.test(u))return{t:'SLIDES',c:'a',h:'Google Slides'};
    if(/canva\.com/.test(u))return{t:'CANVA',c:'d',h:'Canva'};
    if(/sharepoint|onedrive|office\.com|live\.com|1drv/.test(u))return{t:'PPT',c:'i',h:'PowerPoint online'};
    if(/figma\.com/.test(u))return{t:'FIGMA',c:'d',h:'Figma'};
    let host='tautan';try{host=new URL(d.url).hostname.replace(/^www\./,'')}catch(e){}return{t:'LINK',c:'n',h:host}}
  const ct=String(d.contentType||'');if(/pdf/.test(ct))return{t:'PDF',c:'r',h:'PDF'};if(/image/.test(ct))return{t:'IMG',c:'n',h:'Gambar'};return{t:'PPT',c:'i',h:'PowerPoint'}}
const stChip=st=>`<span class="chip ${st==='Final'?'g':st==='Review'?'a':st==='Dipresentasikan'?'i':''}">${esc(st||'Draft')}</span>`;
function vDecks(){
  const all=scoped('decks');const q=DUI.q.toLowerCase();
  const list=all.filter(d=>(!DUI.st||d.status===DUI.st)&&(!DUI.cat||d.category===DUI.cat)&&(!q||[d.title,d.description,d.audience,d.owner,d.version,pcode(d.projectId)].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
  const mk=today().slice(0,7),cnt=st=>all.filter(d=>d.status===st).length;
  const groups=[];list.forEach(d=>{const k=(d.date||'').slice(0,7)||'—';let g=groups.find(x=>x.k===k);if(!g){g={k,items:[]};groups.push(g)}g.items.push(d)});
  const gLabel=k=>{if(k==='—')return'Tanpa tanggal';const[y,m]=k.split('-').map(Number);return MONTHS_L[m-1]+' '+y};
  const card=d=>{const ty=deckType(d),dt=parseD(d.date);return`<article class="deck">
    <div class="deck-top"><span class="deck-ic ${ty.c}">${d.kind==='link'?ic('link'):''}<b>${ty.t}</b></span>

      ${dt?`<span class="deck-date"><b>${dt.getDate()}</b><span>${MONTHS[dt.getMonth()]} ${String(dt.getFullYear()).slice(2)}</span></span>`:''}</div>
    ${d.description?`<p class="deck-desc">${esc(d.description)}</p>`:''}
    <dl class="deck-info">${d.audience?`<dt>Untuk</dt><dd>${esc(d.audience)}</dd>`:''}${d.projectId?`<dt>Proyek</dt><dd>${esc(pcode(d.projectId))}</dd>`:''}<dt>Sumber</dt><dd>${d.kind==='link'?esc(ty.h):esc(d.name||ty.h)+' · '+fmtSize(d.size||0)}</dd>${d.owner?`<dt>Pembuat</dt><dd>${esc(d.owner)}</dd>`:''}</dl>
    <div class="deck-foot"><span class="d-acts"><button class="icb" data-act="chat-open" data-k="d:${esc(d.id)}" title="Diskusikan" aria-label="Diskusikan ${esc(d.title)}">${ic('chat')}</button><button class="icb" data-act="deck-edit" data-id="${esc(d.id)}" title="Edit" aria-label="Edit ${esc(d.title)}">${ic('edit')}</button><button class="icb danger" data-act="deck-del" data-id="${esc(d.id)}" title="Hapus" aria-label="Hapus ${esc(d.title)}">${ic('trash')}</button></span>
      ${d.kind==='link'?`<a class="btn sm pri" href="${esc(d.url)}" target="_blank" rel="noopener">${ic('link')}Buka ${esc(ty.h==='tautan'?'link':ty.h)}</a>`:ty.t==='PPT'?`<button class="btn sm pri" data-act="deck-save" data-id="${esc(d.id)}">${ic('dl')}Unduh PPT</button>`:`<button class="btn sm pri" data-act="deck-open" data-id="${esc(d.id)}">${ic('eye')}Buka ${ty.t}</button>`}</div></article>`};
  return`<div class="toolbar"><h2>Deck &amp; PPT</h2><button class="btn pri" data-act="deck-add">+ Deck</button></div>
  <div class="stats"><div class="kpi"><span class="eyebrow">Total deck</span><span class="v">${all.length}</span><span class="c">${all.filter(d=>(d.date||'').slice(0,7)===mk).length} dibuat bulan ini</span></div>
    <div class="kpi"><span class="eyebrow">Final</span><span class="v">${cnt('Final')}</span><span class="c">Siap dibagikan</span></div>
    <div class="kpi"><span class="eyebrow">Dalam proses</span><span class="v">${cnt('Draft')+cnt('Review')}</span><span class="c">${cnt('Draft')} draft · ${cnt('Review')} review</span></div>
    <div class="kpi"><span class="eyebrow">Dipresentasikan</span><span class="v">${cnt('Dipresentasikan')}</span><span class="c">Sudah disajikan ke stakeholder</span></div></div>
  <div class="deck-filter"><label class="dsearch">${ic('search')}<input id="dk-q" type="search" placeholder="Cari judul, audiens, pembuat…" value="${esc(DUI.q)}" aria-label="Cari deck"></label>
    <select class="inp" id="dk-fst" aria-label="Filter status"><option value="">Semua status</option>${DECK_STAT.map(x=>`<option ${DUI.st===x?'selected':''}>${x}</option>`).join('')}</select>
    <select class="inp" id="dk-fcat" aria-label="Filter kategori"><option value="">Semua kategori</option>${DECK_CAT.map(x=>`<option ${DUI.cat===x?'selected':''}>${x}</option>`).join('')}</select></div>
  ${groups.length?groups.map(g=>`<section class="deck-group"><div class="dg-h"><h3>${gLabel(g.k)}</h3><span>${g.items.length} deck</span></div><div class="deck-grid">${g.items.map(card).join('')}</div></section>`).join(''):`<section class="panel">${emptyBox(all.length?'Tidak ada deck yang cocok dengan pencarian atau filter.':'Belum ada deck. Tambahkan deck dalam bentuk file PDF/PPT atau link (Google Slides, Canva, PowerPoint online).','<button class="btn pri" data-act="deck-add">+ Deck</button>')}</section>`}`}

  const missing=reqDocs(v).find(t=>!vDocs(v).some(d=>d.docType===t))||'Lainnya';
  $('#modal-root').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ut"><div class="mh"><h2 id="ut">Unggah dokumen · ${esc(v.name)}</h2><button class="btn ghost sm x" data-act="close-modal" aria-label="Tutup">✕</button></div>
  <form id="upf"><div class="fld w2"><label for="up-file">File (PDF, PNG, JPG · maks 10 MB)</label><input id="up-file" type="file" accept="application/pdf,.pdf,image/png,image/jpeg" multiple></div><div class="fld"><label for="up-type">Jenis dokumen</label><select id="up-type">${DOC_TYPES.map(t=>`<option ${t===missing?'selected':''}>${t}</option>`).join('')}</select></div><div class="fld"><label for="up-note">Keterangan</label><input id="up-note" type="text" placeholder="misal: versi final, ditandatangani 12 Okt"></div><div class="fld w2"><span class="hint" id="up-status"></span></div>
  <div class="mf"><button type="button" class="btn" data-act="close-modal">Batal</button><button type="submit" class="btn pri" id="up-go">Unggah di latar belakang</button></div></form></div></div>`;
  let picked=files?Array.from(files):[];
  const st=$('#up-status');const show=()=>{st.textContent=picked.length?picked.map(f=>f.name+' ('+fmtSize(f.size)+')').join(', '):''};show();
  $('#up-file').addEventListener('change',e=>{picked=Array.from(e.target.files||[]);show()});
  $('#upf').addEventListener('submit',ev=>{ev.preventDefault();if(!picked.length){toast('Pilih file terlebih dahulu.',true);return}
    const type=$('#up-type').value,note=$('#up-note').value.trim();let n=0;
    for(const f of picked){
      let ct=f.type;if(!OK_TYPES[ct]){const ext=(f.name.split('.').pop()||'').toLowerCase();ct=ext==='pdf'?'application/pdf':ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg')?'image/jpeg':''}
      if(!ct){toast(f.name+': format tidak didukung. Unggah PDF, PNG, atau JPG.',true);continue}
      if(f.size>10*1048576){toast(f.name+' melebihi 10 MB. Kompres PDF lalu unggah ulang.',true);continue}
      UPQ.push({id:'u'+Date.now()+Math.random().toString(36).slice(2,6),file:f,ct,vendorId:v.id,vendorName:v.name,type,note,state:'wait',t0:0,t1:0,err:''});n++;
    }
    if(!n)return;closeModal();renderUploads();pumpUploads();
  });
}
/* ---------- antrean unggah (berjalan di belakang layar) ---------- */
const UPQ=[];let upRunning=false,upTimer=0,upCollapsed=false;
function upEstimate(size){return MODE==='remote'?4+size*1.37/(300*1024):0.6}
function upSecs(u){return Math.max(0,((u.t1||Date.now())-u.t0)/1000)}
function fmtSecs(x){x=Math.round(x);return x<60?x+' dtk':Math.floor(x/60)+' mnt '+(x%60)+' dtk'}
function upPct(u){if(u.state==='done')return 100;if(u.state==='wait')return 0;if(u.state==='read')return 4;if(u.state==='error')return 100;
  const e=upSecs(u),est=upEstimate(u.file.size);return Math.min(94,Math.round(6+88*(1-Math.exp(-e/est*1.15))))}
async function pumpUploads(){if(upRunning)return;upRunning=true;
  if(!upTimer)upTimer=setInterval(renderUploads,250);
  try{for(;;){const u=UPQ.find(x=>x.state==='wait');if(!u)break;
    u.state='read';u.t0=Date.now();renderUploads();
    try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(new Error('File tidak terbaca.'));fr.readAsDataURL(u.file)});
      u.state='send';renderUploads();busy++;
      const before=new Set(S.documents.map(x=>x.id));
      try{applyData(await B.uploadDocument({vendorId:u.vendorId,name:u.file.name,docType:u.type,note:u.note,contentType:u.ct},b64))}finally{busy--}
      if(MODE==='remote'){const nd=S.documents.find(x=>!before.has(x.id)&&x.name===u.file.name);if(nd)DocCache.put(nd.id,u.file)}
      u.state='done';u.t1=Date.now();
    }catch(e){u.state='error';u.t1=Date.now();u.err=e.message||'Gagal mengunggah.';if(e.code==='AUTH'){logout(e.message)}}
    renderUploads()}}
  finally{upRunning=false;clearInterval(upTimer);upTimer=0;renderUploads();
    const done=UPQ.filter(x=>x.state==='done').length,bad=UPQ.filter(x=>x.state==='error').length;
    if(done&&!bad)toast(done+' dokumen berhasil diunggah');}
}
function renderUploads(){let root=$('#upload-root');if(!root){root=document.createElement('div');root.id='upload-root';document.body.appendChild(root)}
  if(!UPQ.length){root.innerHTML='';return}
  const active=UPQ.filter(x=>x.state==='wait'||x.state==='read'||x.state==='send').length,done=UPQ.filter(x=>x.state==='done').length,bad=UPQ.filter(x=>x.state==='error').length;
  const head=active?`Mengunggah ${UPQ.length-active+1} dari ${UPQ.length} file`:bad?`${done} berhasil · ${bad} gagal`:`${done} file berhasil diunggah`;
  const rows=UPQ.map(u=>{const pct=upPct(u),secs=u.t0?fmtSecs(upSecs(u)):'';
    const st=u.state==='wait'?'Menunggu giliran':u.state==='read'?'Membaca file…':u.state==='send'?`${MODE==='remote'?'Mengirim ke Google Drive':'Menyimpan'} · ${secs}`:u.state==='done'?`Selesai dalam ${secs}`:esc(u.err);
    return`<div class="upi ${u.state}"><div class="upi-top"><span class="fi ${/^image\//.test(u.ct)?'img':''}">${/^image\//.test(u.ct)?'IMG':'PDF'}</span><div class="upi-name"><b title="${esc(u.file.name)}">${esc(u.file.name)}</b><span>${esc(u.vendorName)} · ${fmtSize(u.file.size)}</span></div><span class="upi-pct">${u.state==='done'?'✓':u.state==='error'?'!':pct+'%'}</span></div>
    <div class="upi-bar"><i style="width:${pct}%"></i></div><div class="upi-st">${st}${u.state==='error'?` <button class="link" data-act="up-retry" data-id="${u.id}">Coba lagi</button>`:''}${u.state==='send'&&MODE==='remote'?`<span class="faint"> · perkiraan ±${fmtSecs(upEstimate(u.file.size))}</span>`:''}</div></div>`}).join('');
  root.innerHTML=`<div class="upw" role="status" aria-live="polite"><div class="upw-h"><b>${head}</b><span class="upw-acts"><button class="ibtn sm" data-act="up-toggle" aria-label="${upCollapsed?'Tampilkan':'Ciutkan'}">${upCollapsed?'▴':'▾'}</button>${active?'':'<button class="ibtn sm" data-act="up-close" aria-label="Tutup">✕</button>'}</span></div>${upCollapsed?'':`<div class="upw-list">${rows}</div>`}${active&&!upCollapsed?'<div class="upw-f">Proses unggah sedang berlangsung. Anda dapat melanjutkan aktivitas lainnya tanpa menutup halaman ini.</div>':''}</div>`}
window.addEventListener('beforeunload',e=>{if(UPQ.some(x=>x.state==='wait'||x.state==='read'||x.state==='send')){e.preventDefault();e.returnValue=''}});
/* ---------- dokumen: cache permanen di browser + unduh dengan progres ---------- */
const blobCache={},docJobs={};
const DocCache={db:null,MAX:80,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let q;try{q=indexedDB.open('pmo-desk-doccache',1)}catch(e){rej(e);return}
    q.onupgradeneeded=()=>q.result.createObjectStore('docs');q.onsuccess=()=>{this.db=q.result;res(this.db)};q.onerror=()=>rej(q.error)})},
  async get(id){try{const db=await this.open();return await new Promise(r=>{const t=db.transaction('docs','readonly').objectStore('docs').get(id);t.onsuccess=()=>r(t.result&&t.result.blob||null);t.onerror=()=>r(null)})}catch(e){return null}},
  async put(id,blob){try{const db=await this.open();await new Promise(r=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put({blob,ts:Date.now()},id);tx.oncomplete=r;tx.onerror=r});this.trim()}catch(e){}},
  async trim(){try{const db=await this.open();const all=await new Promise(r=>{const out=[];const c=db.transaction('docs','readonly').objectStore('docs').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out.push([cur.key,cur.value.ts]);cur.continue()}else r(out)};c.onerror=()=>r(out)});
    if(all.length<=this.MAX)return;all.sort((x,y)=>x[1]-y[1]);const tx=db.transaction('docs','readwrite');all.slice(0,all.length-this.MAX).forEach(([k])=>tx.objectStore('docs').delete(k))}catch(e){}},
  async del(id){try{const db=await this.open();db.transaction('docs','readwrite').objectStore('docs').delete(id)}catch(e){}},
  clear(){try{if(this.db){this.db.close();this.db=null}indexedDB.deleteDatabase('pmo-desk-doccache')}catch(e){}Object.keys(blobCache).forEach(k=>{try{URL.revokeObjectURL(blobCache[k])}catch(e){}delete blobCache[k]})}};
/* Unduh isi dokumen dari server sambil melaporkan byte yang sudah diterima. */
async function fetchDocRemote(d,onBytes){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),180000);
  let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:SESSION.key,who:SESSION.name,action:'getFile',args:[d.id]}),redirect:'follow',signal:ctl.signal})}
  catch(e){clearTimeout(tm);throw new Error(e&&e.name==='AbortError'?'Server Google terlalu lama merespons. Coba lagi.':'Tidak bisa terhubung ke server Google. Periksa internet lalu coba lagi.')}
  if(!r.ok){clearTimeout(tm);throw new Error('Server Google tidak merespons (kode '+r.status+').')}
  let text='';
  if(r.body&&r.body.getReader){const rd=r.body.getReader(),dec=new TextDecoder();let n=0;for(;;){const {done,value}=await rd.read();if(done)break;n+=value.length;text+=dec.decode(value,{stream:true});onBytes&&onBytes(n)}text+=dec.decode()}
  else text=await r.text();
  clearTimeout(tm);let j;try{j=JSON.parse(text)}catch(e){throw new Error('Balasan server tidak terbaca.')}
  if(!j.ok){const er=new Error(j.error||'Dokumen tidak bisa dimuat.');er.code=j.code;throw er}
  const f=j.data;const blob=await (await fetch('data:'+(f.contentType||d.contentType||'application/pdf')+';base64,'+f.b64)).blob();
  return blob}
/* Satu unduhan per dokumen; pemanggil lain cukup ikut mendengarkan progresnya. */
function docBlob(d,onProg){
  if(blobCache[d.id])return Promise.resolve(blobCache[d.id]);
  let job=docJobs[d.id];
  if(!job){job=docJobs[d.id]={t0:Date.now(),bytes:0,total:Math.ceil((d.size||0)/3)*4+300,listeners:new Set(),stage:'cache'};
    job.p=(async()=>{try{
      let blob=MODE==='remote'?await DocCache.get(d.id):null;
      if(!blob){job.stage='net';job.listeners.forEach(f=>f(job));
        if(MODE==='remote')blob=await fetchDocRemote(d,n=>{job.bytes=n;job.listeners.forEach(f=>f(job))});
        else{const f=await B.getFile(d.id);blob=await (await fetch('data:'+(f.contentType||d.contentType)+';base64,'+f.b64)).blob()}
        if(MODE==='remote')DocCache.put(d.id,blob)}
      const url=URL.createObjectURL(blob);blobCache[d.id]=url;return url}
      finally{delete docJobs[d.id]}})()}
  if(onProg){job.listeners.add(onProg);onProg(job)}
  return job.p}
/* Mulai unduh diam-diam saat kursor mendekati dokumen, agar saat diklik sudah siap. */

async function saveDoc(id){const d=S.documents.find(x=>x.id===id);if(!d)return;let tk=0;const show=job=>{if(job.stage!=='net')return;const sec=Math.round((Date.now()-job.t0)/1000);toast('Menyiapkan unduhan '+d.name+' · '+sec+' detik')};

async function chatPoll(){if(!CHAT.started)return;
