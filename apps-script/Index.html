<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base target="_top">
<title>Corporate Banking PMO Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: command desk — ink band header + tab rail; 12-col panel grid, summary on top, registers below */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0F1B2B; --muted:#566376; --faint:#8592A4;
  --line:#DCE1E8; --line-2:#C7CFDA;
  --band:#0F1B2B; --band-ink:#E8EDF4; --band-muted:#93A2B6; --band-line:#24344C; --band-2:#17263B;
  --accent:#0E6390; --accent-ink:#FFFFFF; --accent-soft:#E1EDF5; --accent-2:#5FA3C7;
  --g:#2B8143; --g-soft:#E2F1E6; --a:#B47400; --a-soft:#FAEFD8; --r:#BF382E; --r-soft:#FAE3E0;
  --scrim:rgba(10,18,30,.48); --shadow:0 1px 2px rgba(15,27,43,.06),0 8px 24px rgba(15,27,43,.06);
  --f-display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111B; --surface:#111B27; --surface-2:#172330; --ink:#E5EBF2; --muted:#9AA8B9; --faint:#6E7D90;
  --line:#223142; --line-2:#2E4055;
  --band:#060B12; --band-ink:#E5EBF2; --band-muted:#8494A8; --band-line:#1C2A3B; --band-2:#0F1A27;
  --accent:#4BA6D6; --accent-ink:#06121C; --accent-soft:#12324A; --accent-2:#2D6F96;
  --g:#4CC07A; --g-soft:#143323; --a:#E5A83A; --a-soft:#3A2C10; --r:#F06A5F; --r-soft:#3D1A18;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A111B; --surface:#111B27; --surface-2:#172330; --ink:#E5EBF2; --muted:#9AA8B9; --faint:#6E7D90;
  --line:#223142; --line-2:#2E4055;
  --band:#060B12; --band-ink:#E5EBF2; --band-muted:#8494A8; --band-line:#1C2A3B; --band-2:#0F1A27;
  --accent:#4BA6D6; --accent-ink:#06121C; --accent-soft:#12324A; --accent-2:#2D6F96;
  --g:#4CC07A; --g-soft:#143323; --a:#E5A83A; --a-soft:#3A2C10; --r:#F06A5F; --r-soft:#3D1A18;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Header band */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:1px solid var(--band-line)}
.band-in{max-width:1360px;margin:0 auto;padding-inline:20px}
.band-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px 10px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:20px;height:20px}
.brand h1{font-size:17px;font-weight:600;color:var(--band-ink)}
.brand p{margin:0;font-size:12px;color:var(--band-muted)}
.band-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.today{font-family:var(--f-mono);font-size:12px;color:var(--band-muted);padding:6px 10px;border:1px solid var(--band-line);border-radius:6px}
.scope{background:var(--band-2);color:var(--band-ink);border:1px solid var(--band-line);border-radius:6px;padding:6px 10px;max-width:260px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--band-muted);padding:10px 14px;cursor:pointer;white-space:nowrap;font-weight:500;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--band-ink)}
.tab[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--accent)}
.tab .ct{font-family:var(--f-mono);font-size:11px;background:var(--band-2);border:1px solid var(--band-line);border-radius:10px;padding:0 6px;color:var(--band-muted)}

/* Page */
.wrap{max-width:1360px;margin:0 auto;padding-inline:20px;padding-block:22px 64px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}
@media (max-width:1000px){.s8,.s7,.s6,.s5,.s4{grid-column:span 12}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.ph{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.ph h2{font-size:15px;font-weight:600}
.ph .sub{font-size:12px;color:var(--muted)}
.ph .end{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar h2{font-size:20px;font-weight:600;margin-right:auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--r)} .btn.danger:hover{border-color:var(--r);color:var(--r)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500}
.link:hover{text-decoration:underline}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.g{background:var(--g-soft);color:var(--g);border-color:transparent}
.chip.a{background:var(--a-soft);color:var(--a);border-color:transparent}
.chip.r{background:var(--r-soft);color:var(--r);border-color:transparent}
.chip.i{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.ex{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--faint);border:1px dashed var(--line-2);border-radius:4px;padding:0 4px}

/* Insight band */
.insights{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.insights li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface-2);border-radius:8px}
.insights li .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:12px}
.ic.r{background:var(--r-soft);color:var(--r)} .ic.a{background:var(--a-soft);color:var(--a)} .ic.g{background:var(--g-soft);color:var(--g)} .ic.i{background:var(--accent-soft);color:var(--accent)}
.insights b{font-weight:600}
@media (min-width:1001px){.insights{grid-template-columns:1fr 1fr}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .v small{font-size:14px;color:var(--muted);font-weight:500}
.kpi .c{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--r)} .kpi.amber .v{color:var(--a)}
.meter{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--accent)}

/* Donut */
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.legend{display:grid;gap:10px;flex:1;min-width:160px}
.legend .row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center}
.legend .sw{width:12px;height:12px;border-radius:3px}

/* Health table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.pname{font-weight:600;line-height:1.3}
.pbar{position:relative;height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;min-width:120px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.pbar i.g{background:var(--g)} .pbar i.a{background:var(--a)} .pbar i.r{background:var(--r)}
.pbar b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.var.pos{color:var(--g)} .var.neg{color:var(--r)} .var.mid{color:var(--a)}
.stepper{display:flex;gap:3px;align-items:center}
.stepper i{width:14px;height:5px;border-radius:2px;background:var(--line-2)}
.stepper i.on{background:var(--accent)}
.stepper i.cur{background:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* Budget bars */
.bud{display:grid;gap:14px}
.bud .row{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;align-items:center}
@media (max-width:560px){.bud .row{grid-template-columns:1fr}}
.bud .lab{min-width:0}
.bud .lab .code{display:block}
.bud .lab span.n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.btrack{position:relative;height:18px;background:var(--surface-2);border-radius:4px;border:1px solid var(--line)}
.btrack .bgt{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent-soft)}
.btrack .spt{position:absolute;left:0;top:4px;bottom:4px;border-radius:2px;background:var(--accent)}
.btrack .spt.over{background:var(--r)}
.btrack .ev{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.bmeta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.lg span{display:inline-flex;gap:6px;align-items:center}
.lg i{display:inline-block;width:12px;height:8px;border-radius:2px}

/* Heatmap */
.heat{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:4px;font-size:11px}
.heat .ax{display:grid;place-items:center;color:var(--muted);font-family:var(--f-mono)}
.hc{aspect-ratio:1.5;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:14px;border:1px solid transparent;max-width:100%}
.hc.lo{background:var(--g-soft);color:var(--g)} .hc.md{background:var(--a-soft);color:var(--a)} .hc.hi{background:var(--r-soft);color:var(--r)}
.hc.zero{color:transparent}
button.hc{cursor:pointer}
button.hc.sel{border-color:var(--ink)}
.heat-x{display:flex;justify-content:space-between;margin:6px 0 0 32px;font-size:11px;color:var(--muted)}

/* Lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.datebox{width:46px;text-align:center;border:1px solid var(--line);border-radius:6px;padding:3px 0;background:var(--surface-2)}
.datebox .m{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.datebox .d{font-family:var(--f-display);font-size:17px;font-weight:600;line-height:1.1}
.li .t{font-weight:600;line-height:1.3}
.li .s{font-size:12px;color:var(--muted)}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:8px;display:grid;gap:8px;justify-items:center}

/* Gantt */
.gantt{min-width:820px}
.g-row{display:grid;grid-template-columns:230px 1fr;align-items:center;border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-lab{padding:10px 12px 10px 0;min-width:0}
.g-lab .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.g-track{position:relative;height:54px}
.g-months{position:relative;height:28px}
.g-months span{position:absolute;top:6px;font-size:11px;color:var(--muted);font-family:var(--f-mono);padding-left:6px;border-left:1px solid var(--line);height:22px;white-space:nowrap}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-bar{position:absolute;top:17px;height:20px;border-radius:5px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2);cursor:pointer}
.g-bar .f{position:absolute;left:0;top:0;bottom:0;opacity:.9}
.g-bar .f.g{background:var(--g)} .g-bar .f.a{background:var(--a)} .g-bar .f.r{background:var(--r)}
.g-bar .lbl{position:relative;font-size:11px;font-family:var(--f-mono);padding:0 6px;line-height:18px;color:var(--ink);font-weight:500;white-space:nowrap}
.g-ms{position:absolute;top:9px;width:10px;height:10px;transform:translateX(-5px) rotate(45deg);border:2px solid var(--ink);background:var(--surface)}
.g-ms.done{background:var(--ink)} .g-ms.late{border-color:var(--r);background:var(--r)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--r);opacity:.75}
.g-today-lab{position:absolute;top:-2px;transform:translateX(-50%);font-size:10px;font-family:var(--f-mono);color:var(--surface);background:var(--r);padding:0 5px;border-radius:3px;white-space:nowrap}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.cday{min-height:86px;border:1px solid var(--line);border-radius:6px;padding:5px;background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cday:hover{border-color:var(--accent-2)}
.cday.out{background:var(--surface-2);color:var(--faint)}
.cday.tod{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cday.sel{background:var(--accent-soft)}
.cday .n{font-family:var(--f-mono);font-size:12px;font-weight:500}
.cday .ev{font-size:11px;line-height:1.25;padding:2px 4px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cday .more{font-size:11px;color:var(--muted)}
@media (max-width:640px){.cday{min-height:52px}.cday .ev{display:none}.cday.has::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}}

.mcard{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mcard + .mcard{margin-top:10px}
.mcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mcard .t{font-weight:600;font-size:14px;line-height:1.3}
.mcard .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mcard details summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:500}
.mcard .body{display:grid;gap:8px;margin-top:8px;font-size:13px}
.mcard .body h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mcard .body p{margin:0;white-space:pre-wrap}
.mcard ul{margin:0;padding-left:18px}
.mcard .acts{display:flex;gap:6px;margin-left:auto}

/* Vendors */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
@media (max-width:420px){.vgrid{grid-template-columns:1fr}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.vcard.drag{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vcard .hd{display:flex;gap:10px;align-items:start}
.vcard .hd h3{font-size:15px;font-weight:600;line-height:1.3}
.vcard .hd .acts{margin-left:auto;display:flex;gap:4px;flex:none}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;font-size:12.5px}
.kv div{min-width:0}
.kv .k{font-size:11px;color:var(--muted);display:block}
.kv .val{overflow-wrap:anywhere}
.stars{color:var(--a);letter-spacing:1px}
.stars .off{color:var(--line-2)}
.req{display:flex;gap:6px;flex-wrap:wrap}
.docs{display:grid;gap:6px}
.doc{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.doc .fi{width:30px;height:36px;border-radius:4px;background:var(--r-soft);color:var(--r);display:grid;place-items:center;font-size:9px;font-weight:700;font-family:var(--f-mono)}
.doc .fi.img{background:var(--accent-soft);color:var(--accent)}
.doc .nm{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .sm{font-size:11.5px;color:var(--muted)}
.doc .acts{display:flex;gap:2px}
.drop{border:1px dashed var(--line-2);border-radius:6px;padding:10px;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;background:none;width:100%}
.drop:hover{border-color:var(--accent);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:16px}
@media (max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:7px 10px;min-width:0}

/* Banner */
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line-2);border-radius:8px;margin-bottom:16px;font-size:13px;color:var(--muted);background:var(--surface)}
.banner .btn{margin-left:auto}

/* Modal & drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;max-width:640px;box-shadow:var(--shadow)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mh h2{font-size:16px;font-weight:600}
.modal .mh .x{margin-left:auto}
.modal form{padding:18px 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:520px){.modal form{grid-template-columns:1fr}.fld.w2{grid-column:auto!important}}
.fld{display:grid;gap:5px;min-width:0}
.fld.w2{grid-column:span 2}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:8px 10px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld .hint{font-size:11.5px;color:var(--faint)}
.mf{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;padding-top:6px;border-top:1px solid var(--line);margin-top:4px;padding-top:14px}
.mf .left{margin-right:auto}
.drawer-scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;overflow-y:auto;border-left:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 40px)}
.drawer .dh{display:flex;gap:10px;align-items:start;margin-bottom:16px}
.drawer .dh h2{font-size:20px;font-weight:600;line-height:1.25}
.drawer section{margin-top:16px}
.dstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:520px){.dstats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dstats .kpi .v{font-size:20px}
.ms{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-size:13px;font-weight:500;max-width:calc(100% - 32px)}
.toast.err{background:var(--r);color:#fff}
.skel{display:grid;gap:16px}
.skel div{height:90px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){.skel div{animation:pulse 1.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.55}}}
</style>
</head>
<body>


<header class="band">
  <div class="band-in">
    <div class="band-top">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M2 10l10-6 10 6"/></svg></div>
      <div class="brand"><h1>Corporate Banking PMO Desk</h1><p>Portofolio proyek · vendor · meeting · risiko</p></div>
      <div class="band-tools">
        <label for="scope" class="eyebrow" style="color:var(--band-muted)">Fokus</label>
        <select id="scope" class="scope"><option value="all">Semua proyek</option></select>
        <span class="today" id="today"></span>
        <span class="today" id="who" hidden></span>
        <button class="btn sm" id="sync" data-act="sync" style="background:var(--band-2);color:var(--band-ink);border-color:var(--band-line)">Muat ulang</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
(function(){
"use strict";
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLS=['projects','milestones','meetings','vendors','documents','risks'];
const S={};COLS.forEach(c=>S[c]=[]);
const loaded={};
let storeState='loading',META={},errMsg='',busy=0,lastSync=null;const assets=true,downloads=null;
const UI={tab:'overview',scope:'all',calMonth:null,calDay:null,riskCell:null,docQ:'',docType:'',projectOpen:null};

const TABS=[['overview','Ringkasan'],['projects','Proyek'],['timeline','Timeline'],['meetings','Meeting'],['vendors','Vendor & Dokumen'],['risks','Risiko']];
const PHASES=['Inisiasi','Perencanaan','Eksekusi','UAT','Go-Live','Selesai'];
const RAG={g:'On track',a:'Perlu perhatian',r:'Kritis'};
const MS_STAT=['Belum mulai','Berjalan','Selesai','Terblokir'];
const MEET_TYPES=['Steering Committee','Weekly Progress','Vendor Meeting','Workshop / Requirement','UAT Review','Internal'];
const V_CAT=['Software / Core System','System Integrator','Konsultan','Infrastruktur / Cloud','Data & Analytics','Lainnya'];
const V_STAT=['Evaluasi / RFP','Negosiasi','PKS ditandatangani','Aktif','Selesai'];
const DOC_TYPES=['NDA','Proposal / RFP','PKS / Kontrak','Invoice','BAST','Notulen','Lainnya'];
const R_CAT=['Teknologi','Regulasi / Compliance','Vendor','Jadwal','Anggaran','Operasional'];
const R_STAT=['Open','Mitigasi berjalan','Closed'];
const SEG=['Corporate Banking','Commercial Banking','Transaction Banking','Cash Management','Trade Finance'];
const MONTHS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const MONTHS_L=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DOW=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{if(!s)return null;const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const fmtDate=s=>{const d=parseD(s);return d?d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear():'—'};
const fmtDS=s=>{const d=parseD(s);return d?d.getDate()+' '+MONTHS[d.getMonth()]:'—'};
const n1=x=>x.toLocaleString('id-ID',{maximumFractionDigits:1});
const rp=v=>{v=+v||0;const a=Math.abs(v);if(a>=1e12)return'Rp '+n1(v/1e12)+' T';if(a>=1e9)return'Rp '+n1(v/1e9)+' M';if(a>=1e6)return'Rp '+n1(v/1e6)+' jt';return'Rp '+Math.round(v).toLocaleString('id-ID')};
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sum=(arr,f)=>arr.reduce((s,x)=>s+(+f(x)||0),0);
const fmtSize=b=>b>=1048576?n1(b/1048576)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const proj=id=>S.projects.find(p=>p.id===id);
const pcode=id=>{const p=proj(id);return p?p.code||p.name:'—'};
const inScope=pid=>UI.scope==='all'||pid===UI.scope;
const scopedProjects=()=>S.projects.filter(p=>inScope(p.id)).sort((a,b)=>(a.code||'').localeCompare(b.code||''));
const scoped=c=>S[c].filter(x=>inScope(x.projectId));
const isActive=p=>p.phase!=='Selesai';
function elapsed(p){const t=today();if(!p.start||!p.end)return 0;const tot=diffDays(p.start,p.end);if(tot<=0)return 100;return clamp(Math.round(diffDays(p.start,t)/tot*100),0,100)}
const variance=p=>(+p.progress||0)-elapsed(p);
const rScore=r=>(+r.impact||0)*(+r.likelihood||0);
const rBand=s=>s>=15?'hi':s>=8?'md':'lo';
const rBandChip=s=>s>=15?'r':s>=8?'a':'g';
const rOpen=r=>r.status!=='Closed';
const msLate=m=>m.status!=='Selesai'&&m.due&&m.due<today();
function reqDocs(v){const base=['NDA','Proposal / RFP'];if(['PKS ditandatangani','Aktif'].includes(v.status))return[...base,'PKS / Kontrak'];if(v.status==='Selesai')return[...base,'PKS / Kontrak','BAST'];return base}
const vDocs=v=>S.documents.filter(d=>d.vendorId===v.id);
function ragChip(r){return`<span class="chip ${r||''}"><span class="d"></span>${esc(RAG[r]||'—')}</span>`}
function stepper(phase){const i=PHASES.indexOf(phase);return`<span class="stepper" title="${esc(phase||'')}">${PHASES.slice(0,5).map((_,k)=>`<i class="${k<i||i===5?'on':k===i?'cur':''}"></i>`).join('')}</span>`}
function stars(n){n=+n||0;return`<span class="stars" aria-label="${n} dari 5">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`}
const exTag=x=>x.example?' <span class="ex">contoh</span>':'';

/* ---------- store ---------- */
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function RUN(fn,...args){return new Promise((res,rej)=>{if(!(window.google&&google.script&&google.script.run)){rej({message:'NO_GAS'});return}google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)})}
function applyData(d){if(!d)return;COLS.forEach(c=>S[c]=Array.isArray(d[c])?d[c]:[]);META=d.meta||{};storeState='ready';lastSync=new Date();schedule()}
async function boot(){
  try{const t=localStorage.getItem('pmo.tab');if(t&&TABS.some(x=>x[0]===t))UI.tab=t}catch(e){}
  const h=(location.hash||'').slice(1);if(TABS.some(x=>x[0]===h))UI.tab=h;
  render();
  try{applyData(await RUN('getAll'))}
  catch(e){storeState=e&&e.message==='NO_GAS'?'none':'error';errMsg=gasMsg(e);render();return}
  setInterval(poll,60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});
}
async function poll(){
  if(document.hidden||busy||$('#modal-root').innerHTML)return;
  try{const d=await RUN('getAll');const ae=document.activeElement;
    if(ae&&$('#main').contains(ae)&&/INPUT|SELECT|TEXTAREA/.test(ae.tagName)){COLS.forEach(c=>S[c]=d[c]||[]);META=d.meta||META;return}
    applyData(d)}catch(e){}
}
async function sync(){const b=$('#sync');if(b){b.disabled=true;b.textContent='Memuat…'}try{applyData(await RUN('getAll'));toast('Data terbaru dimuat')}catch(e){toast(gasMsg(e),true)}finally{const b2=$('#sync');if(b2){b2.disabled=false;b2.textContent='Muat ulang'}}}
function gasMsg(e){const m=String((e&&e.message)||e||'');if(m==='NO_GAS')return'Halaman ini perlu dibuka lewat alamat Web App Google Apps Script.';if(/NetworkError|network|Failed to fetch|disconnected/i.test(m))return'Koneksi ke server terputus. Periksa internet lalu klik Muat ulang.';if(/authoriz|otoris|login/i.test(m))return'Sesi Google berakhir. Muat ulang halaman dan login kembali.';return m.replace(/^Exception:\s*/,'')||'Terjadi kesalahan di server. Coba lagi.'}
async function call(fn,...args){busy++;try{applyData(await RUN(fn,...args));return true}catch(e){toast(gasMsg(e),true);return false}finally{busy--}}
async function put(col,id,data){const body=Object.assign({},data);if(id)body.id=id;delete body.updatedAt;delete body.updatedBy;return call('saveItem',col,body)}
async function patch(col,id,data){return call('saveItem',col,Object.assign({id},data))}
async function del(col,id){return call('deleteItems',[{col,id}])}

/* ---------- toast ---------- */
let tt=0;function toast(msg,err){const r=$('#toast-root');r.innerHTML=`<div class="toast${err?' err':''}" role="status">${esc(msg)}</div>`;clearTimeout(tt);tt=setTimeout(()=>{r.innerHTML=''},err?5200:2600)}

/* ---------- header ---------- */
function renderHeader(){
  const w=$('#who');if(META.user){w.textContent=META.user;w.hidden=false}else w.hidden=true;
  const t=new Date();$('#today').textContent=DOW[(t.getDay()+6)%7]+', '+t.getDate()+' '+MONTHS[t.getMonth()]+' '+t.getFullYear();
  const counts={projects:scopedProjects().filter(isActive).length,meetings:scoped('meetings').filter(m=>m.date>=today()).length,vendors:S.vendors.filter(v=>inScope(v.projectId)).length,risks:scoped('risks').filter(rOpen).length};
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" data-act="tab" data-k="${k}" aria-selected="${UI.tab===k}">${l}${counts[k]!=null&&storeState==='ready'?`<span class="ct">${counts[k]}</span>`:''}</button>`).join('');
  const sel=$('#scope');const cur=UI.scope;
  sel.innerHTML='<option value="all">Semua proyek</option>'+S.projects.slice().sort((a,b)=>(a.code||'').localeCompare(b.code||'')).map(p=>`<option value="${esc(p.id)}">${esc(p.code||'')} · ${esc(p.name)}</option>`).join('');
  if(cur!=='all'&&!proj(cur))UI.scope='all';
  sel.value=UI.scope;
}

/* ---------- render ---------- */
function render(){
  renderHeader();
  const main=$('#main');
  if(storeState==='loading'){main.innerHTML='<div class="skel" aria-label="Memuat data"><div></div><div style="height:140px"></div><div style="height:260px"></div></div>';return}
  if(storeState==='none'||storeState==='error'){main.innerHTML=`<div class="panel"><div class="empty"><b>${storeState==='none'?'Halaman ini belum terhubung ke Google Sheets.':'Data belum bisa dimuat.'}</b><span>${esc(errMsg)}</span>${storeState==='error'?'<button class="btn pri" data-act="sync">Coba lagi</button>':''}</div></div>`;return}
  const v0={overview:vOverview,projects:vProjects,timeline:vTimeline,meetings:vMeetings,vendors:vVendors,risks:vRisks};
  main.innerHTML=exampleBanner()+v0[UI.tab]();
  const ft=lastSync?`<p class="faint" style="font-size:11.5px;margin-top:24px">Tersinkron dengan Google Sheets pukul ${pad(lastSync.getHours())}:${pad(lastSync.getMinutes())} · data diperbarui otomatis setiap menit.</p>`:'';main.insertAdjacentHTML('beforeend',ft);
  if(UI.projectOpen)renderDrawer();
}
function hasExamples(){return COLS.some(c=>S[c].some(x=>x.example))}
function exampleBanner(){if(!hasExamples())return'';return`<div class="banner"><span class="ex">contoh</span><span>Data bertanda <b>contoh</b> adalah ilustrasi agar dashboard langsung terbaca. Edit untuk menjadikannya milik Anda, atau hapus semuanya sekaligus.</span><button class="btn sm" data-act="clear-ex">Hapus data contoh</button></div>`}
function emptyBox(msg,btn){return`<div class="empty"><span>${msg}</span>${btn||''}</div>`}

/* ---------- insights ---------- */
function insights(){
  const t=today(),out=[];
  const act=scopedProjects().filter(isActive);
  if(!act.length)return[{l:'i',h:'Belum ada proyek aktif. Tambahkan proyek pertama untuk mulai memantau portofolio.'}];
  const lag=act.map(p=>({p,v:variance(p)})).filter(x=>x.v<=-10).sort((a,b)=>a.v-b.v);
  lag.slice(0,2).forEach(({p,v})=>out.push({l:'r',h:`<b>${esc(p.code)}</b> ${esc(p.name)} tertinggal <b>${-v} poin</b> dari jadwal: progres ${p.progress}% sementara ${elapsed(p)}% waktu sudah berjalan.`}));
  const late=scoped('milestones').filter(msLate).sort((a,b)=>a.due.localeCompare(b.due));
  if(late.length)out.push({l:'r',h:`<b>${late.length} milestone lewat tenggat</b>: ${late.slice(0,3).map(m=>`${esc(m.title)} (${esc(pcode(m.projectId))}, ${-diffDays(t,m.due)} hari)`).join('; ')}${late.length>3?', dan lainnya':''}.`});
  const burn=act.filter(p=>+p.budget>0&&pct(p.spent,p.budget)-(+p.progress||0)>=8).sort((a,b)=>(pct(b.spent,b.budget)-b.progress)-(pct(a.spent,a.budget)-a.progress));
  burn.slice(0,2).forEach(p=>out.push({l:'a',h:`Serapan anggaran <b>${esc(p.code)}</b> ${pct(p.spent,p.budget)}% melampaui progres ${p.progress}%. Selisih ${rp(+p.spent-(+p.budget*(+p.progress||0)/100))} perlu dicek terhadap potensi cost overrun.`}));
  const hi=scoped('risks').filter(r=>rOpen(r)&&rScore(r)>=15).sort((a,b)=>rScore(b)-rScore(a));
  if(hi.length)out.push({l:'r',h:`<b>${hi.length} risiko skor tinggi</b> masih terbuka. Teratas: ${esc(hi[0].title)} (${esc(pcode(hi[0].projectId))}, skor ${rScore(hi[0])}).`});
  const noMom=scoped('meetings').filter(m=>m.date<t&&!String(m.mom||'').trim());
  if(noMom.length)out.push({l:'a',h:`<b>${noMom.length} meeting</b> sudah berlangsung tanpa notulen: ${noMom.slice(0,2).map(m=>esc(m.title)).join(', ')}${noMom.length>2?', dan lainnya':''}.`});
  const vs=S.vendors.filter(v=>inScope(v.projectId));
  const ending=vs.filter(v=>v.contractEnd&&v.status!=='Selesai'&&diffDays(t,v.contractEnd)>=0&&diffDays(t,v.contractEnd)<=60);
  ending.forEach(v=>out.push({l:'a',h:`Kontrak <b>${esc(v.name)}</b> berakhir ${fmtDate(v.contractEnd)} (${diffDays(t,v.contractEnd)} hari lagi). Siapkan perpanjangan atau BAST.`}));
  const noPks=vs.filter(v=>['Aktif','PKS ditandatangani'].includes(v.status)&&!vDocs(v).some(d=>d.docType==='PKS / Kontrak'));
  if(noPks.length)out.push({l:'a',h:`PKS belum diarsipkan untuk <b>${noPks.length} vendor aktif</b>: ${noPks.map(v=>esc(v.name)).join(', ')}.`});
  const nx=scoped('meetings').filter(m=>m.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const wk=nx.filter(m=>m.date<=addDays(t,7));
  if(nx.length)out.push({l:'i',h:`<b>${wk.length} meeting</b> dalam 7 hari ke depan. Berikutnya: ${esc(nx[0].title)}, ${fmtDS(nx[0].date)} ${esc(nx[0].time||'')}.`});
  const ahead=act.filter(p=>variance(p)>=3);
  if(ahead.length)out.push({l:'g',h:`${ahead.map(p=>`<b>${esc(p.code)}</b>`).join(', ')} berjalan di depan jadwal.`});
  return out.slice(0,8);
}

/* ---------- overview ---------- */
function vOverview(){
  const t=today(),ps=scopedProjects(),act=ps.filter(isActive);
  const avg=act.length?Math.round(sum(act,p=>p.progress)/act.length):0;
  const avgEl=act.length?Math.round(sum(act,elapsed)/act.length):0;
  const bud=sum(act,p=>p.budget),sp=sum(act,p=>p.spent);
  const late=scoped('milestones').filter(msLate).length;
  const ms30=scoped('milestones').filter(m=>m.status!=='Selesai'&&m.due>=t&&m.due<=addDays(t,30)).length;
  const meet7=scoped('meetings').filter(m=>m.date>=t&&m.date<=addDays(t,7)).length;
  const hi=scoped('risks').filter(r=>rOpen(r)&&rScore(r)>=15).length;
  const openR=scoped('risks').filter(rOpen).length;
  const ins=insights();
  return`<div class="grid">
  <section class="panel s12"><div class="ph"><h2>Sorotan PMO</h2><span class="sub">Dibaca otomatis dari data proyek, milestone, meeting, vendor, dan risiko</span></div>
    <ul class="insights">${ins.map(x=>`<li><span class="ic ${x.l}">${x.l==='r'?'!':x.l==='a'?'▲':x.l==='g'?'✓':'i'}</span><span>${x.h}</span></li>`).join('')}</ul></section>
  <div class="s12 kpis">
    <div class="kpi"><span class="eyebrow">Proyek aktif</span><span class="v">${act.length}<small> / ${ps.length}</small></span><span class="c">${act.filter(p=>p.rag==='r').length} kritis · ${act.filter(p=>p.rag==='a').length} perlu perhatian</span></div>
    <div class="kpi"><span class="eyebrow">Rata-rata progres</span><span class="v">${avg}<small>%</small></span><div class="meter"><i style="width:${avg}%"></i></div><span class="c">Waktu berjalan rata-rata ${avgEl}%</span></div>
    <div class="kpi ${pct(sp,bud)>avg+8?'amber':''}"><span class="eyebrow">Serapan anggaran</span><span class="v">${pct(sp,bud)}<small>%</small></span><span class="c num">${rp(sp)} dari ${rp(bud)}</span></div>
    <div class="kpi ${late?'warn':''}"><span class="eyebrow">Milestone terlambat</span><span class="v">${late}</span><span class="c">${ms30} jatuh tempo 30 hari ke depan</span></div>
    <div class="kpi"><span class="eyebrow">Meeting 7 hari</span><span class="v">${meet7}</span><span class="c">${scoped('meetings').filter(m=>m.date<t&&!String(m.mom||'').trim()).length} notulen tertunda</span></div>
    <div class="kpi ${hi?'warn':''}"><span class="eyebrow">Risiko tinggi</span><span class="v">${hi}<small> / ${openR}</small></span><span class="c">Skor ≥ 15 dari risiko terbuka</span></div>
  </div>
  <section class="panel s4"><div class="ph"><h2>Status RAG portofolio</h2><span class="sub">Proyek aktif</span></div>${donut(act)}</section>
  <section class="panel s8"><div class="ph"><h2>Kesehatan jadwal</h2><span class="sub">Progres aktual vs waktu yang sudah berjalan</span><span class="end lg"><span><i style="background:var(--accent)"></i>Progres</span><span><i style="background:var(--ink);width:2px;height:12px"></i>Rencana per hari ini</span></span></div>${healthTable(act)}</section>
  <section class="panel s7"><div class="ph"><h2>Anggaran vs realisasi</h2><span class="sub">Earned value = anggaran × progres</span></div>
    <div class="lg" style="margin-bottom:14px"><span><i style="background:var(--accent-soft);border:1px solid var(--line)"></i>Anggaran</span><span><i style="background:var(--accent)"></i>Realisasi</span><span><i style="background:var(--r)"></i>Realisasi > nilai progres</span><span><i style="background:var(--ink);width:2px;height:12px"></i>Nilai progres (EV)</span></div>${budgetBars(act)}</section>
  <section class="panel s5"><div class="ph"><h2>Peta risiko</h2><span class="sub">${openR} risiko terbuka</span><span class="end"><button class="link" data-act="tab" data-k="risks">Lihat register →</button></span></div>${heatmap(scoped('risks').filter(rOpen),false)}</section>

function donut(act){
  if(!act.length)return emptyBox('Belum ada proyek aktif.');
  const c={g:0,a:0,r:0};act.forEach(p=>{if(c[p.rag]!=null)c[p.rag]++});
  const tot=act.length,R=54,C=2*Math.PI*R;let off=0;
  const segs=['r','a','g'].map(k=>{const len=c[k]/tot*C;const s=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--${k})" stroke-width="18" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 75 75)"/>`;off+=len;return c[k]?s:''}).join('');
  return`<div class="donut-wrap"><svg class="donut" viewBox="0 0 150 150" role="img" aria-label="Distribusi status RAG"><circle r="${R}" cx="75" cy="75" fill="none" stroke="var(--surface-2)" stroke-width="18"/>${segs}<text x="75" y="72" text-anchor="middle" fill="var(--ink)" style="font:600 26px var(--f-display)">${tot}</text><text x="75" y="92" text-anchor="middle" fill="var(--muted)" style="font:500 11px var(--f-body)">proyek</text></svg>
  <div class="legend">${['g','a','r'].map(k=>`<div class="row"><span class="sw" style="background:var(--${k})"></span><span>${RAG[k]}</span><span class="num">${c[k]} <span class="faint">· ${pct(c[k],tot)}%</span></span></div>`).join('')}</div></div>`;
}
function healthTable(act){
  if(!act.length)return emptyBox('Belum ada proyek aktif.');
  const rows=act.slice().sort((a,b)=>variance(a)-variance(b)).map(p=>{const v=variance(p),e=elapsed(p),left=p.end?diffDays(today(),p.end):null;
    return`<tr class="click" data-act="open-project" data-id="${esc(p.id)}"><td><span class="code">${esc(p.code)}</span><div class="pname">${esc(p.name)}${exTag(p)}</div></td><td>${ragChip(p.rag)}</td><td style="min-width:150px"><div class="pbar"><i class="${p.rag}" style="width:${clamp(+p.progress||0,0,100)}%"></i><b style="left:calc(${e}% - 1px)"></b></div><div class="bmeta"><span class="num">${p.progress||0}% / ${e}%</span></div></td><td class="r num var ${v>=0?'pos':v>-10?'mid':'neg'}">${v>0?'+':''}${v}</td><td class="r"><span class="num">${fmtDS(p.end)}</span><div class="faint" style="font-size:11.5px">${left==null?'':left>=0?left+' hari lagi':'lewat '+(-left)+' hari'}</div></td></tr>`}).join('');
  return`<div class="tbl-wrap"><table><thead><tr><th>Proyek</th><th>RAG</th><th>Progres / rencana</th><th class="r">Deviasi (poin)</th><th class="r">Target selesai</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
function budgetBars(act){
  const ps=act.filter(p=>+p.budget>0);if(!ps.length)return emptyBox('Isi anggaran proyek untuk melihat perbandingan.');
  const mx=Math.max(...ps.map(p=>Math.max(+p.budget,+p.spent||0)));
  return`<div class="bud">${ps.map(p=>{const b=+p.budget,s=+p.spent||0,ev=b*(+p.progress||0)/100,over=s>ev*1.05;
    return`<div class="row"><div class="lab"><span class="code">${esc(p.code)}</span><span class="n" title="${esc(p.name)}">${esc(p.name)}</span></div><div><div class="btrack"><span class="bgt" style="width:${b/mx*100}%"></span><span class="spt ${over?'over':''}" style="width:${s/mx*100}%"></span><span class="ev" style="left:calc(${ev/mx*100}% - 1px)"></span></div><div class="bmeta num"><span>${rp(s)} / ${rp(b)}</span><span>${pct(s,b)}% terserap</span><span>EV ${rp(ev)}</span></div></div></div>`}).join('')}</div>`;
}
function heatmap(risks,interactive){
  const cell=(i,l)=>risks.filter(r=>+r.impact===i&&+r.likelihood===l).length;
  let h='<div class="heat" role="grid" aria-label="Matriks dampak x kemungkinan">';
  for(let i=5;i>=1;i--){h+=`<span class="ax" title="Dampak ${i}">${i}</span>`;for(let l=1;l<=5;l++){const n=cell(i,l),b=rBand(i*l),sel=UI.riskCell===i+'-'+l;
    h+=interactive?`<button class="hc ${b} ${n?'':'zero'} ${sel?'sel':''}" data-act="risk-cell" data-k="${i}-${l}" aria-label="Dampak ${i}, kemungkinan ${l}: ${n} risiko">${n||'·'}</button>`:`<span class="hc ${b} ${n?'':'zero'}" title="Dampak ${i} × Kemungkinan ${l}">${n||'·'}</span>`}}
  return h+`</div><div class="heat-x"><span>Kemungkinan 1 →</span><span>5</span></div><div class="faint" style="font-size:11px;margin-top:2px">Sumbu vertikal: dampak (1–5)</div>`;
}
function meetingRow(m){const d=parseD(m.date);return`<div class="li"><div class="datebox"><div class="m">${MONTHS[d.getMonth()]}</div><div class="d">${d.getDate()}</div></div><div style="min-width:0"><div class="t">${esc(m.title)}${exTag(m)}</div><div class="s">${esc(m.time||'')}${m.duration?' · '+m.duration+' mnt':''} · ${esc(pcode(m.projectId))} · ${esc(m.location||'—')}</div></div><span class="chip i">${esc(m.type||'Meeting')}</span></div>`}

function fieldHTML([k,label,type,o],val){o=o||{};const id='f-'+k,req=o.req?'required':'',v=val??'';let inp;

  else inp=`<input id="${id}" name="${k}" type="${type}" value="${esc(v)}" ${req} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${o.min!=null?`min="${o.min}"`:''} ${o.max!=null?`max="${o.max}"`:''} ${o.step?`step="${o.step}"`:''}>`;
  return`<div class="fld ${o.w2?'w2':''}"><label for="${id}">${label}${o.req?' *':''}</label>${inp}${o.hint?`<span class="hint">${esc(o.hint)}</span>`:''}</div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function openForm(col,item,preset){
  const sc=SCHEMA[col],isNew=!item;const data=Object.assign({},item||{},preset||{});
  if(isNew){if(col==='projects')Object.assign(data,{phase:data.phase||'Inisiasi',rag:data.rag||'g',priority:'Sedang',progress:0,start:today()});if(col==='milestones')data.status=data.status||'Belum mulai';if(col==='meetings'){data.date=data.date||today();data.time=data.time||'10:00';data.duration=data.duration||60;data.type=data.type||'Weekly Progress'}if(col==='vendors')data.status=data.status||'Evaluasi / RFP';if(col==='risks')Object.assign(data,{impact:data.impact||3,likelihood:data.likelihood||3,status:'Open'});if(!data.projectId&&UI.scope!=='all'&&col!=='projects')data.projectId=UI.scope}

  $('#modal-root').innerHTML=`<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mh"><h2 id="mt">${isNew?'Tambah':'Edit'} ${sc.t.toLowerCase()}</h2><button class="btn ghost sm x" data-act="close-modal" aria-label="Tutup">✕</button></div>
  <form id="frm" novalidate>${sc.f.map(f=>fieldHTML(f,data[f[0]])).join('')}<div class="mf">${!isNew?`<button type="button" class="btn danger left" data-act="${col==='projects'?'del-project':'del'}" data-c="${col}" data-id="${esc(item.id)}">Hapus</button>`:''}<button type="button" class="btn" data-act="close-modal">Batal</button><button type="submit" class="btn pri">${isNew?'Simpan':'Simpan perubahan'}</button></div></form></div></div>`;
  const frm=$('#frm');setTimeout(()=>{const f=frm.querySelector('input,select,textarea');f&&f.focus()},30);
  frm.addEventListener('submit',async ev=>{ev.preventDefault();
    const miss=sc.f.filter(f=>f[3]&&f[3].req&&!String(frm.elements[f[0]].value).trim());
    if(miss.length){toast('Lengkapi: '+miss.map(f=>f[1]).join(', '),true);frm.elements[miss[0][0]].focus();return}
    const out=Object.assign({},item||{});delete out.id;out.example=false;

  let picked=files?Array.from(files):[];
  const st=$('#up-status');const show=()=>{st.textContent=picked.length?picked.map(f=>f.name+' ('+fmtSize(f.size)+')').join(', '):''};show();
  $('#up-file').addEventListener('change',e=>{picked=Array.from(e.target.files||[]);show()});
  $('#upf').addEventListener('submit',async ev=>{ev.preventDefault();if(!picked.length){toast('Pilih file terlebih dahulu.',true);return}
    const go=$('#up-go');go.disabled=true;const type=$('#up-type').value,note=$('#up-note').value.trim();let ok=0;
    for(const f of picked){
      let ct=f.type;if(!OK_TYPES[ct]){const ext=(f.name.split('.').pop()||'').toLowerCase();ct=ext==='pdf'?'application/pdf':ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg')?'image/jpeg':''}
      if(!ct){toast(f.name+': format tidak didukung. Unggah PDF, PNG, atau JPG.',true);continue}
      if(f.size>10*1048576){toast(f.name+' melebihi 10 MB. Kompres PDF lalu unggah ulang.',true);continue}
      st.textContent='Mengunggah '+f.name+' ke Google Drive…';
      try{const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(new Error('File tidak terbaca.'));fr.readAsDataURL(f)});
        if(await call('uploadDocument',{vendorId:v.id,projectId:v.projectId||'',name:f.name,docType:type,note,contentType:ct},b64))ok++;
      }catch(e){toast(f.name+': '+gasMsg(e),true)}
    }
    if(ok){closeModal();toast(ok+' dokumen tersimpan')}else{go.disabled=false;st.textContent=''}
  });
}
/* ---------- actions ---------- */
function setTab(k){UI.tab=k;try{localStorage.setItem('pmo.tab',k)}catch(e){}try{history.replaceState(null,'','#'+k)}catch(e){}window.scrollTo(0,0);render()}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,c=el.dataset.c,k=el.dataset.k;
  if(a==='scrim'){if(e.target===el)closeModal();return}
  if(a==='tab')return setTab(k);
  if(a==='close-modal')return closeModal();
  if(a==='open-project'){UI.projectOpen=id;renderDrawer();return}
  if(a==='close-drawer'){UI.projectOpen=null;$('#drawer-root').innerHTML='';return}
  if(a==='add'){const pre={};if(el.dataset.p)pre.projectId=el.dataset.p;if(el.dataset.date)pre.date=el.dataset.date;return openForm(c,null,pre)}
  if(a==='edit'){const it=S[c].find(x=>x.id===id);if(it)openForm(c,it);return}
  if(a==='del'){const it=S[c].find(x=>x.id===id);if(!it)return;return confirmBox('Hapus '+SCHEMA[c].t.toLowerCase()+'?',`<b>${esc(it.title||it.name)}</b> akan dihapus permanen.`+(c==='vendors'&&vDocs(it).length?` ${vDocs(it).length} dokumen milik vendor ini juga ikut terhapus.`:''),'Hapus',async()=>{
      if(await del(c,id))toast(SCHEMA[c].t+' dihapus')})}
  if(a==='del-project'){const p=proj(id);if(!p)return;const n=['milestones','meetings','risks'].reduce((s,c2)=>s+S[c2].filter(x=>x.projectId===id).length,0);
    return confirmBox('Hapus proyek?',`<b>${esc(p.code)} ${esc(p.name)}</b> beserta ${n} milestone, meeting, dan risiko terkait akan dihapus permanen. Vendor dan dokumen tetap disimpan tanpa tautan proyek.`,'Hapus proyek',async()=>{UI.projectOpen=null;$('#drawer-root').innerHTML='';if(await call('deleteProject',id))toast('Proyek dihapus')})}
  if(a==='ms-cycle'){const m=S.milestones.find(x=>x.id===id);if(!m)return;const nx=MS_STAT[(MS_STAT.indexOf(m.status)+1)%MS_STAT.length];el.textContent=nx;return patch('milestones',id,{status:nx})}
  if(a==='cal-nav'){const n=+k;if(n===0){const d=new Date();UI.calMonth=new Date(d.getFullYear(),d.getMonth(),1);UI.calDay=today()}else UI.calMonth=new Date(UI.calMonth.getFullYear(),UI.calMonth.getMonth()+n,1);return render()}
  if(a==='cal-day'){UI.calDay=k&&UI.calDay!==k?k:null;return render()}
  if(a==='risk-cell'){UI.riskCell=k&&UI.riskCell!==k?k:null;return render()}
  if(a==='upload')return openUpload(id);
  if(a==='doc-del'){const d=S.documents.find(x=>x.id===id);if(!d)return;return confirmBox('Hapus dokumen?',`<b>${esc(d.name)}</b> akan dihapus dari arsip dan dipindahkan ke Sampah Google Drive.`,'Hapus',async()=>{if(await del('documents',id))toast('Dokumen dihapus')})}
  if(a==='sync')return sync();
  if(a==='clear-ex'){let n=0;COLS.forEach(c2=>n+=S[c2].filter(x=>x.example).length);return confirmBox('Hapus semua data contoh?',`${n} entri bertanda contoh akan dihapus. Data yang sudah Anda edit atau tambahkan sendiri tetap aman.`,'Hapus data contoh',async()=>{UI.projectOpen=null;$('#drawer-root').innerHTML='';if(await call('clearExamples'))toast('Data contoh dihapus')})}
});
document.addEventListener('change',e=>{
  if(e.target.id==='scope'){UI.scope=e.target.value;UI.riskCell=null;render()}
  if(e.target.id==='doc-type'){UI.docType=e.target.value;render()}
});
let qT=0;document.addEventListener('input',e=>{if(e.target.id==='doc-q'){clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{UI.docQ=v;render();const i=$('#doc-q');if(i){i.focus();i.setSelectionRange(v.length,v.length)}},250)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();else if(UI.projectOpen){UI.projectOpen=null;$('#drawer-root').innerHTML=''}}});
/* drag & drop onto vendor cards */
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&assets){e.preventDefault();document.querySelectorAll('.vcard.drag').forEach(x=>x!==c&&x.classList.remove('drag'));c.classList.add('drag')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('drag')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('drag');if(e.dataTransfer&&e.dataTransfer.files.length)openUpload(c.dataset.drop,e.dataTransfer.files)});

boot();
})();
</script>
